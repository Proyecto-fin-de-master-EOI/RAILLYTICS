# Basado en la plantilla oficial de Spark 4.2.0 (org/apache/spark/log4j2-defaults.properties),
# con rootLogger.level bajado a warn para no inundar la consola con el INFO de
# SparkContext/DAGScheduler/BlockManager en cada arranque de las apps.

rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

# Silenciados que ya trae Spark por defecto — se mantienen igual.
logger.jetty.name = org.sparkproject.jetty
logger.jetty.level = warn
logger.jetty2.name = org.sparkproject.jetty.util.component.AbstractLifeCycle
logger.jetty2.level = error
logger.repl1.name = org.apache.spark.repl.SparkIMain$exprTyper
logger.repl1.level = info
logger.repl2.name = org.apache.spark.repl.SparkILoop$SparkILoopInterpreter
logger.repl2.level = info
logger.repl.name = org.apache.spark.repl.Main
logger.repl.level = warn

logger.metastore.name = org.apache.hadoop.hive.metastore.RetryingHMSHandler
logger.metastore.level = fatal
logger.metastore2.name = org.apache.hadoop.hive.metastore.ObjectStore
logger.metastore2.level = error

logger.parquet.name = org.apache.parquet.CorruptStatistics
logger.parquet.level = error
logger.parquet2.name = parquet.CorruptStatistics
logger.parquet2.level = error

# Silenciado propio del proyecto: al leer en batch una ruta con glob (p.ej.
# ".../*"), Spark comprueba internamente si esa carpeta viene de una query de
# streaming pasando la ruta tal cual (con el "*" literal, sin expandir) a
# fs.getFileStatus() — falla con FileNotFoundException, la captura y solo
# registra el aviso "Assume no metadata directory". Es interno y esperado,
# no un error real.
logger.filestreamsink.name = org.apache.spark.sql.execution.streaming.sinks.FileStreamSink
logger.filestreamsink.level = error
