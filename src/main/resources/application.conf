# Configuración de las apps Scala (Typesafe Config, formato HOCON).
#
# Precedencia, de mayor a menor (ver raillytics.common.config.AppConfig):
#   1. propiedades del sistema (-Dclave=valor en la JVM)
#   2. variables de entorno (el Makefile las exporta desde el .env)
#   3. el .env del proyecto, leído directamente (para sbt o el IDE sin make)
#   4. los valores por defecto de este fichero
#
# Las claves ${?NOMBRE} se rellenan con la variable NOMBRE de cualquiera de
# las tres primeras fuentes; si no existe, queda el valor por defecto. Son las
# mismas variables que usan docker-compose y el lado Python (.env.example).
raillytics {

  # MinIO: endpoint y credenciales que Spark usa a través de S3A.
  minio {
    endpoint = "http://localhost:9000"
    endpoint = ${?MINIO_ENDPOINT}
    user = ""
    user = ${?MINIO_ROOT_USER}
    password = ""
    password = ${?MINIO_ROOT_PASSWORD}
    buckets {
      bronze = "raillytics-bronze"
      bronze = ${?MINIO_BUCKET_BRONZE}
      silver = "raillytics-silver"
      silver = ${?MINIO_BUCKET_SILVER}
      gold = "raillytics-gold"
      gold = ${?MINIO_BUCKET_GOLD}
    }
  }

  spark {
    # local[*] salvo que se indique un clúster; en este proyecto todo corre en local.
    master = "local[*]"
    master = ${?SPARK_MASTER}
    s3a {
      # MinIO expone los buckets como rutas (http://host:puerto/bucket), no como
      # subdominios (bucket.host), que es lo que S3A asume por defecto.
      path-style-access = true
      # El MinIO de docker-compose va por http, sin TLS.
      ssl-enabled = false
    }
  }

  # Raíces de cada capa del lake. Por defecto los buckets de MinIO (esquema
  # s3a://, el de Hadoop); SILVER_ROOT / GOLD_ROOT / TRAZABILIDAD_ROOT permiten
  # apuntar a directorios locales, como hacen los tests.
  lake {
    bronze-root = "s3a://"${raillytics.minio.buckets.bronze}
    silver-root = "s3a://"${raillytics.minio.buckets.silver}
    silver-root = ${?SILVER_ROOT}
    gold-root = "s3a://"${raillytics.minio.buckets.gold}
    gold-root = ${?GOLD_ROOT}
    # Registro de cargas: un prefijo "técnico" dentro de Gold (el guion bajo
    # inicial hace que Spark lo ignore si alguien lee el bucket entero).
    trazabilidad-root = ${raillytics.lake.gold-root}"/_trazabilidad"
    trazabilidad-root = ${?TRAZABILIDAD_ROOT}
  }

  # Apps de ingesta Bronze (L1 raw-uploader y L2 parquet-converter). Las rutas
  # locales son relativas a la raíz del repo, que es desde donde se lanzan.
  ingesta {
    # Registro de fuentes, compartido con la descarga Python.
    data-sources = "config/data_sources.yml"
    data-sources = ${?DATA_SOURCES_CONFIG}
    # Donde deja los ficheros la descarga Python, por fuente.
    staging-root = "data/bronze"
    staging-root = ${?STAGING_ROOT}
    # Ficheros ya subidos por L1 y pendientes de L2. Es HERMANO del staging, no
    # un subdirectorio: así el glob de L1 no los vuelve a ver.
    l1-done-root = "data/bronze_l1_done"
    l1-done-root = ${?L1_DONE_ROOT}
    # Ficheros que ya completaron L1 y L2.
    processed-root = "data/bronze_processed"
    processed-root = ${?PROCESSED_ROOT}
    # Checkpoints de Structured Streaming (uno por query): recuerdan qué ficheros
    # se procesaron ya. Borrarlos hace que las apps reprocesen todo lo que encuentren.
    checkpoint-root = "data/checkpoints"
    checkpoint-root = ${?CHECKPOINT_ROOT}
    l2 {
      # Cada cuánto reintenta L2 arrancar las fuentes que aún no tienen ficheros en L1.
      pending-retry = 30 seconds
    }
  }

  gold {
    # Un servicio cuenta como puntual si llega con este retraso o menos (minutos).
    umbral-puntualidad-min = 5
  }
}
