dashboard_title: Oferta y ocupación · AVE Madrid–Barcelona
description: 'Servicio que publica cada operador en el NAP (datos reales) y coeficiente de ocupación diaria (mitad real: el
  total del trimestre es de la CNMC y el reparto entre días lo hacen reglas del proyecto). Incluye el perfil mensual medido
  con el turismo del INE, del que sale el coeficiente base_mes del reparto. AVISOS: el NAP da trenes y no plazas, así que
  esto es servicio y no capacidad; falta Iryo, que no publica horarios; y la ocupación no es «viajeros por plaza», que pasa
  del 100 % legítimamente porque un asiento se vende por tramos. Glosario, linaje y casos de uso en docs/gobierno-datos.md.'
