    - ROW-oc-aviso
    meta:
      width: 12
      height: 60
      code: "## Qué se puede concluir de este cuadro de mandos\n\n**La oferta es real y la ocupación es mitad real.** Los\
        \ trenes al día salen de los horarios que\npublica el NAP. La ocupación es `viajeros·km / plazas·km`: el total del\
        \ trimestre es de la CNMC,\npero **el reparto entre los días lo hacen reglas del proyecto**, así que la ocupación\
        \ de un día\nconcreto no es una medición.\n\n**Dos avisos que cambian la lectura:**\n\n- **El NAP da trenes, no plazas.**\
        \ Una composición doble cuenta como un tren, así que esto es\n  *servicio* y no *capacidad*. Y falta Iryo, que no\
        \ publica horarios: la oferta cubre Renfe y OUIGO.\n- **No es «viajeros por plaza».** Un asiento se vende por tramos,\
        \ así que ese ratio pasa del 100 %\n  legítimamente. Medido en km, el 100 % sí es un techo real.\n\nEl glosario completo,\
        \ con el linaje y qué no se puede concluir de cada concepto, está en\n`docs/gobierno-datos.md` del repositorio."
