    meta:
      width: 12
      height: 52
      code: '## El peso de cada mes: el único coeficiente del reparto que salió de un dato medido


        La CNMC publica por trimestre, así que el reparto diario trataba enero y marzo como el mismo nivel.

        El INE mide que no lo son: **marzo y julio concentran el 38,1 % de su trimestre y agosto el 29,1 %**,

        frente al 33,3 % de un mes neutro, y es estable año a año.


        Los meses cuyo efecto no se distingue del neutro con cinco años de muestra se dejan en **1,000

        clavado** en `config/reglas_demanda.yml`: medir una diferencia no da derecho a afirmarla. La tabla de

        aquí abajo muestra lo **medido**, así que para esos meses verás un valor cercano a 1 pero no exacto.


        **Lo que esta serie no es:** turistas de tren. Son viajes en todos los medios de transporte y solo los

        que implican pernoctación. Se usa su forma, no su nivel.'
