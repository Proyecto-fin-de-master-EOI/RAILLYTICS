      code: '**Cómo leer la ocupación.** Los trenes al día son dato del NAP; el total del trimestre, de la CNMC. El reparto entre los días lo hacen reglas del proyecto, así que **la ocupación de un día concreto no es una medición**. Y el NAP da trenes, no plazas: falta Iryo, que no publica horarios. El detalle, en `docs/gobierno-datos.md`.


