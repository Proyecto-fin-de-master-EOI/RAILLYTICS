dashboard_title: Panel de dirección · Corredor Madrid–Barcelona
description: 'Vista ejecutiva del corredor: demanda prevista para el trimestre, días de demanda punta y las alertas de capacidad
  con la causa que las explica. Es una PREVISIÓN, no una medición: el total del trimestre es real (CNMC) y el reparto entre
  días lo hacen reglas, dos de ellas calibradas con dato medido. No incluye demanda por tren ni por franja horaria —nadie
  las publica— ni precio recomendado: el KPI de precio es el observado de la CNMC. Glosario y linaje en docs/gobierno-datos.md.'
