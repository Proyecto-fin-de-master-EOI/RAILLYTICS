    meta:
      width: 12
      height: 68
      code: '## Qué estás viendo, y qué no


        **Esto es una previsión, no una medición.** El total del trimestre es real —lo publica la CNMC— pero

        el reparto entre los días lo hacen las reglas de `config/reglas_demanda.yml`. Dos de sus coeficientes

        salen de dato medido (el día de la semana, de los trenes que circulan; el mes, del turismo del INE) y

        el resto son hipótesis documentadas.


        **La «causa detectada» no la adivina un modelo**: es el campo `motivo`, que dice literalmente qué

        reglas se aplicaron a ese día. Por eso se puede auditar fila a fila.


        **Tres cosas que esta pantalla NO puede decirte, y conviene saberlo antes de que alguien pregunte:**


        | lo que falta | por qué |

        | --- | --- |

        | demanda por tren o por servicio | nadie la publica; el NAP da qué trenes circulan, no cuánta gente va |

        | demanda por franja horaria | la serie es diaria, no intradía |

        | un precio recomendado | no hay modelo de precios. El KPI de precio es el **observado** de la CNMC |


        La ocupación prevista tampoco aparece, y por una razón concreta: hace falta la oferta futura, y la

        serie de trenes solo llega hasta el último snapshot descargado del NAP. La ocupación **histórica**

        está en el cuadro de mandos de oferta y ocupación.'
