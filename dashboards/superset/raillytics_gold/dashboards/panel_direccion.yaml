    - TAB-detalle
    - ROW-of-oc-hallazgo
    meta:
      width: 12
      height: 60
      code: '## Por qué hay días con ocupación «imposible», y por qué no se borran


        **21 de los 25 días que pasan del 100 % son sábados o domingos** (40 % y 42 % de todos los fines de

        semana), frente al 0-8 % de los laborables. No es un fallo aleatorio de la fuente: es sistemático.


        La causa más probable es el aviso de arriba. Las plazas por tren se calculan como una **constante

        trimestral**, así que si el operador pone composiciones dobles los días de ocio —práctica habitual—

        la capacidad del fin de semana sale corta y la ocupación sale alta. Haría falta un **1,26× en la

        capacidad del domingo** para que ninguno pasara del 100 %: equivale a que una cuarta parte de los

        trenes lleve doble composición.


        **Consecuencia práctica:** la ocupación del fin de semana **no sirve** para decidir los coeficientes

        de sábado y domingo del reparto. Bajarlos para que «cuadre» sería arreglar un error de medición de la

        capacidad distorsionando un parámetro de demanda. Los días imposibles se marcan (`plausible`), no se

        borran, para que esto se vea en vez de desaparecer.'
