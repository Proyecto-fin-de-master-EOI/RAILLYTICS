dashboard_title: Demanda ferroviaria · AVE Madrid–Barcelona
description: 'Viajeros del corredor AVE Madrid–Barcelona (línea AVE-MAD-BCN): por operador y estación, evolución temporal,
  por día de la semana, impacto de festivos y meteorología. Fuente: capa Gold (DuckDB sobre MinIO).'
css: "/* ===== Raillytics — estilo de cuadro de mandos =====\n   Tarjetas blancas sobre fondo gris, acento violeta y números\
  \ grandes legibles.\n   Los selectores son los de Superset 6; si alguno cambia de nombre en una versión\n   futura, lo único\
  \ que pasa es que esa regla deja de aplicarse. */\n\n:root {\n  --rl-violeta: #6C3FD1;\n  --rl-violeta-claro: #F1ECFB;\n\
  \  --rl-fondo: #F6F7FB;\n  --rl-borde: #E8EAF2;\n  --rl-texto: #1F2437;\n  --rl-suave: #6B7187;\n  --rl-ok: #16A34A;\n \
  \ --rl-aviso: #D97706;\n}\n\n/* Fondo de la rejilla: gris claro, para que las tarjetas blancas despeguen */\n.dashboard\
  \ .dashboard-content,\n.dashboard .grid-content,\n.dashboard-content {\n  background-color: var(--rl-fondo);\n}\n\n/* Cada\
  \ gráfica, una tarjeta */\n.dashboard-component-chart-holder {\n  background: #FFFFFF;\n  border: 1px solid var(--rl-borde);\n\
  \  border-radius: 14px;\n  box-shadow: 0 1px 2px rgba(31, 36, 55, .04), 0 8px 24px rgba(31, 36, 55, .05);\n  padding: 4px\
  \ 6px 8px;\n  transition: box-shadow .18s ease, transform .18s ease;\n}\n.dashboard-component-chart-holder:hover {\n  box-shadow:\
  \ 0 2px 4px rgba(31, 36, 55, .06), 0 12px 32px rgba(108, 63, 209, .10);\n}\n\n/* Título de cada gráfica: más pequeño, en\
  \ mayúsculas y gris, como en la maqueta */\n.dashboard-component-chart-holder .header-title,\n.dashboard-component-chart-holder\
  \ .chart-header .header-title,\n.dashboard-component-chart-holder .editable-title {\n  font-size: 11.5px !important;\n \
  \ font-weight: 700 !important;\n  letter-spacing: .055em;\n  text-transform: uppercase;\n  color: var(--rl-suave) !important;\n\
  }\n\n/* Números grandes (los KPI) */\n.dashboard-component-chart-holder .header-line,\n.superset-legacy-chart-big-number\
  \ .header-line {\n  color: var(--rl-texto) !important;\n  font-weight: 700 !important;\n  letter-spacing: -.02em;\n}\n.dashboard-component-chart-holder\
  \ .subheader-line,\n.superset-legacy-chart-big-number .subheader-line {\n  color: var(--rl-suave) !important;\n  font-weight:\
  \ 500 !important;\n  line-height: 1.35;\n}\n\n/* Barra violeta al pie de las tarjetas de KPI, como en la maqueta */\n#CHART-kpi_demanda_prevista,\n\
  #CHART-kpi_dias_alerta,\n#CHART-kpi_mercado_precio,\n#CHART-kpi_backtest_mape,\n#CHART-kpi_cobertura_oferta,\n#CHART-kpi_ocupacion_media,\n\
  #CHART-kpi_dias_imposibles {\n  border-top: 3px solid var(--rl-violeta);\n}\n\n/* Cabecera del dashboard */\n.dashboard-header,\n\
  .dashboard .dashboard-header {\n  background: #FFFFFF;\n  border-bottom: 1px solid var(--rl-borde);\n}\n.dashboard-header\
  \ .editable-title input,\n.dashboard-header .dashboard-title,\n.dashboard-header h4 {\n  font-weight: 700 !important;\n\
  \  color: var(--rl-texto) !important;\n  letter-spacing: -.01em;\n}\n\n/* Bloques de texto: tarjeta con filo violeta a la\
  \ izquierda */\n.dashboard-markdown {\n  background: #FFFFFF;\n  border: 1px solid var(--rl-borde);\n  border-left: 4px\
  \ solid var(--rl-violeta);\n  border-radius: 12px;\n  padding: 14px 20px;\n  color: var(--rl-texto);\n  box-shadow: 0 1px\
  \ 2px rgba(31, 36, 55, .04);\n}\n.dashboard-markdown h2 {\n  font-size: 15px;\n  font-weight: 700;\n  color: var(--rl-violeta);\n\
  \  margin: 2px 0 10px;\n}\n.dashboard-markdown table { font-size: 12.5px; }\n.dashboard-markdown th {\n  background: var(--rl-violeta-claro);\n\
  \  color: var(--rl-texto);\n  font-weight: 600;\n}\n.dashboard-markdown td, .dashboard-markdown th {\n  border-color: var(--rl-borde);\n\
  \  padding: 6px 10px;\n}\n.dashboard-markdown a { color: var(--rl-violeta); }\n\n/* Tablas de datos */\n.dashboard-component-chart-holder\
  \ .table thead th,\n.dashboard-component-chart-holder table thead th {\n  background: var(--rl-violeta-claro) !important;\n\
  \  color: var(--rl-texto) !important;\n  font-size: 11px !important;\n  font-weight: 700 !important;\n  letter-spacing:\
  \ .04em;\n  text-transform: uppercase;\n  border-bottom: 1px solid var(--rl-borde) !important;\n}\n.dashboard-component-chart-holder\
  \ table tbody tr:hover td {\n  background: #FAF8FE !important;\n}\n\n/* Fila de atribución: discreta, que no compita con\
  \ los datos */\n#MARKDOWN-atribucion {\n  font-size: 11.5px;\n  color: var(--rl-suave);\n}\n#MARKDOWN-atribucion .dashboard-markdown\
  \ {\n  border-left-color: var(--rl-borde);\n  background: #FBFBFD;\n}\n#MARKDOWN-atribucion h2 {\n  font-size: 12px;\n \
  \ color: var(--rl-suave);\n  text-transform: uppercase;\n  letter-spacing: .05em;\n}"
