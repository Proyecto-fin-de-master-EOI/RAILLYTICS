table_name: metricas_modelo
main_dttm_col: generado_en
description: 'Métricas de cada entrenamiento del modelo de ocupación diaria. Lo que hay que mirar NO es el MAPE de partición
  única (8,0 %, que cumple el umbral del plan pero depende de qué semanas tocaron): es el de validación temporal frente a
  su referencia trivial. Hoy: 10,1 % contra 10,3 %, es decir que empata con predecir la media de lo ya visto. El intervalo
  del 90 % cubre el 78 % y mide 24,6 puntos de ocupación, o sea que es ancho Y se queda corto: el modelo es genuinamente incierto.
  Y el aviso de fondo: el objetivo lo generan las reglas de reparto del propio proyecto, así que esto mide reproducir nuestras
  reglas, no acertar la demanda real.'
default_endpoint: null
offset: 0
cache_timeout: null
schema: null
catalog: null
sql: "-- Metricas de cada entrenamiento del modelo de ocupacion (raillytics.ml.modelo), una fila por ejecucion.\n-- Las dos\
  \ lecturas van juntas a proposito y hay que leerlas asi:\n--   mape / r2            particion unica. Es el numero que cumple\
  \ el umbral del plan y es FRAGIL:\n--                        depende de que semanas tocaron en el ultimo corte.\n--   vt_*\
  \                 validacion temporal en 5 tramos, entrenando con el pasado y evaluando en el\n--                      \
  \  futuro, con la referencia trivial (predecir la media de lo ya visto) al lado.\n-- `mejora_sobre_referencia` es la cifra\
  \ honesta: positiva solo si el modelo bate a no hacer nada.\n-- El intervalo (ic_*) sale de dos modelos cuantilicos al 5\
  \ % y al 95 %. Su cobertura MEDIDA es lo que\n-- lo hace creible o no: una banda que dice 90 % y cubre 65 % miente, y una\
  \ que cubre el 90 % por ser\n-- enorme tampoco dice nada. Por eso va tambien la amplitud.\nSELECT\n    run_id,\n    generado_en,\n\
  \    corredor,\n    modelo,\n    objetivo,\n    dias_entrenamiento,\n    dias_test,\n    variables,\n    mape,\n    mae_puntos,\n\
  \    r2,\n    desde,\n    hasta,\n    vt_tramos,\n    vt_mape,\n    vt_mape_referencia,\n    vt_r2,\n    vt_tramos_en_que_gana,\n\
  \    mejora_sobre_referencia,\n    mejora_sobre_referencia > 0                                   AS bate_a_la_referencia,\n\
  \    ic_confianza,\n    ic_cobertura,\n    ic_amplitud_media,\n    generado_en = max(generado_en) OVER ()              \
  \          AS es_ultima\nFROM read_parquet('s3://raillytics-gold/fact_metricas_modelo/*.parquet', union_by_name = true)"
