table_name: turismo_mensual
main_dttm_col: primer_dia_mes
description: 'Turistas que se mueven de Madrid a cada provincia destino, mes a mes (INE, operación TMOV, tabla 53267, datos
  REALES estimados por posición de teléfonos móviles). Es el único dato de nivel MENSUAL del proyecto, y de él sale el coeficiente
  «base_mes» del reparto diario de la predicción. QUÉ NO SE PUEDE CONCLUIR: son viajes en TODOS los medios de transporte,
  no solo en tren, y «turista» implica pernoctación, así que la ida y vuelta en el día no entra. Se usa la FORMA (cuota del
  mes dentro de su trimestre), no el nivel. Atribución obligatoria: «Elaboración propia con datos extraídos del sitio web
  del INE: www.ine.es».'
default_endpoint: null
offset: 0
