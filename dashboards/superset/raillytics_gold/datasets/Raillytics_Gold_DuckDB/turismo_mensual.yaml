sql: "-- Fact_Turismo_Mensual: turistas de Madrid a cada provincia destino, mes a mes (INE, operación TMOV, tabla 53267).\n\
  -- DATOS REALES, estimados por POSICIÓN DE TELÉFONOS MÓVILES (no es una encuesta).\n-- QUÉ NO SE PUEDE CONCLUIR: son viajes\
  \ en TODOS los medios de transporte, y «turista» en TMOV implica\n-- pernoctación, así que la ida y vuelta en el día no\
  \ entra. Se usa la FORMA (cuota del mes dentro de su\n-- trimestre), no el nivel: presentarlo como viajeros de tren sería\
  \ desnaturalizar el dato, que es lo que\n-- prohíbe la licencia del INE.\nSELECT\n    primer_dia_mes,\n    anio, mes, nombre_mes,\
  \ trimestre,\n    anio || '-T' || trimestre                               AS trimestre_etiqueta,\n    origen, destino, tipo_dato,\n\
  \    turistas,\n    cuota_del_trimestre,\n    anio NOT IN (2020, 2021)                                AS sin_pandemia,\n\
  \    destino = 'Barcelona'                                   AS es_corredor_del_proyecto\nFROM read_parquet('s3://raillytics-gold/fact_turismo_mensual/*.parquet')"
