table_name: viajeros_diarios
main_dttm_col: fecha
description: Viajeros diarios por estación y línea (Fact_Viajeros ⋈ Dim_Fecha, Dim_Estacion, Dim_Linea), leídos con DuckDB
  del Parquet de s3://raillytics-gold.
default_endpoint: null
offset: 0
cache_timeout: null
schema: null
catalog: null
sql: |-
  -- Fact_Viajeros con sus dimensiones (modelo en estrella de la capa Gold).
  SELECT
      f.fecha,
      d.anio,
      d.trimestre,
      d.mes,
      d.nombre_mes,
      d.dia_semana,
      d.nombre_dia,
      d.dia_semana || '. ' || d.nombre_dia AS dia_semana_etiqueta,
      d.es_fin_de_semana,
      d.es_festivo,
      d.festivo_nombre,
      CASE
          WHEN d.es_festivo THEN 'festivo'
          WHEN d.es_fin_de_semana THEN 'fin de semana'
          ELSE 'laborable'
      END AS tipo_dia,
      d.estacion_anio,
      e.nombre AS estacion,
      e.provincia,
      e.comunidad,
      e.latitud,
      e.longitud,
      l.nombre AS linea,
      l.tipo_tren,
      l.origen,
      l.destino,
      f.viajeros,
      f.temperatura_media,
      f.precipitacion_mm,
      f.condicion_meteo
  FROM read_parquet('s3://raillytics-gold/fact_viajeros/*.parquet') AS f
  JOIN read_parquet('s3://raillytics-gold/dim_fecha/*.parquet') AS d USING (fecha_id)
  JOIN read_parquet('s3://raillytics-gold/dim_estacion/*.parquet') AS e USING (estacion_id)
  JOIN read_parquet('s3://raillytics-gold/dim_linea/*.parquet') AS l USING (linea_id)
