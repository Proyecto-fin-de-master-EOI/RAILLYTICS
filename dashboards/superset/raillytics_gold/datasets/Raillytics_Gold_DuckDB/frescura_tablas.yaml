table_name: frescura_tablas
main_dttm_col: ultima_carga
description: Última carga de cada tabla del lake y horas transcurridas desde entonces.
default_endpoint: null
offset: 0
cache_timeout: null
schema: null
catalog: null
sql: |-
  -- Última carga de cada tabla y cuánto hace de ella (semáforo de frescura).
  SELECT
      capa,
      proceso,
      tabla,
      timezone('Europe/Madrid', timezone('UTC', max(fin)))                    AS ultima_carga,
      round(date_diff('minute', max(fin), timezone('UTC', now())) / 60.0, 1)  AS horas_desde_ultima_carga,
      arg_max(estado, fin)                                                    AS ultimo_estado,
      arg_max(filas, fin)                                                     AS ultimas_filas,
      count(*)                                                                AS n_cargas,
      count(*) FILTER (WHERE estado = 'error')                                AS n_errores
  FROM read_parquet('s3://raillytics-gold/_trazabilidad/cargas/*.parquet', union_by_name = true)
  WHERE tabla IS NOT NULL
  GROUP BY capa, proceso, tabla
