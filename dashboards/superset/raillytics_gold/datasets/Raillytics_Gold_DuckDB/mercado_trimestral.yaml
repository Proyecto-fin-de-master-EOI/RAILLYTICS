table_name: mercado_trimestral
main_dttm_col: fecha_inicio
description: 'Mercado trimestral del corredor AVE Madrid–Barcelona por operador. Datos REALES de la CNMC (no sintéticos), solo el corredor
  AVE Madrid–Barcelona. En la demanda Avlo va dentro de Renfe (la CNMC no la separa); en los precios aparece por separado hasta 2025-T4.
  «Viajeros por plaza ofertada» no es ocupación: un asiento sirve a varios tramos, y por eso
  llega a pasar del 100%. La ocupación real es «Coeficiente de ocupación», que pondera por distancia (viajeros·km / plazas·km).'
default_endpoint: null
offset: 0
cache_timeout: null
schema: null
catalog: null
sql: |-
  -- Fact_Mercado_Trimestral ⋈ Dim_Operador, leído con DuckDB del Parquet de Gold en MinIO (datos reales de la CNMC).
  -- La fila TOTAL del corredor solo lleva ingresos; el resto de columnas por operador. Avlo va dentro de RENFE.
  WITH base AS (
      SELECT f.fecha_inicio, f.anio, f.trimestre, f.operador_id,
             CASE f.operador_id WHEN 'RENFE' THEN 'Renfe (incl. Avlo)' WHEN 'TOTAL' THEN 'Total corredor' ELSE coalesce(o.nombre, f.operador_id) END AS operador,
             f.viajeros, f.plazas_ofertadas, f.plazas_km, f.tren_km, f.viajeros_km, f.ingresos_eur
      FROM read_parquet('s3://raillytics-gold/fact_mercado_trimestral/*.parquet') AS f
      LEFT JOIN read_parquet('s3://raillytics-gold/dim_operador/*.parquet') AS o USING (operador_id)
  ),
  total AS (
      SELECT fecha_inicio, SUM(viajeros) AS viajeros_corredor FROM base WHERE operador_id <> 'TOTAL' GROUP BY fecha_inicio
  ),
  total_yoy AS (
      SELECT fecha_inicio, viajeros_corredor,
             viajeros_corredor * 1.0 / LAG(viajeros_corredor, 4) OVER (ORDER BY fecha_inicio) - 1 AS variacion_interanual_corredor
      FROM total
  )
  SELECT b.fecha_inicio, b.anio || '-T' || b.trimestre AS trimestre_etiqueta, b.anio, b.trimestre, b.operador_id, b.operador,
         b.operador_id = 'TOTAL' AS es_total,
         b.viajeros, b.plazas_ofertadas, b.plazas_km, b.tren_km, b.viajeros_km, b.ingresos_eur,
         CASE WHEN b.operador_id <> 'TOTAL' THEN b.viajeros * 1.0 / t.viajeros_corredor END AS cuota_viajeros,
         CASE WHEN b.plazas_ofertadas > 0 THEN b.viajeros * 1.0 / b.plazas_ofertadas END AS viajeros_por_plaza,
         CASE WHEN b.operador_id <> 'TOTAL' THEN b.viajeros * 1.0 / LAG(b.viajeros, 4) OVER (PARTITION BY b.operador_id ORDER BY b.fecha_inicio) - 1 END AS variacion_interanual,
         t.viajeros_corredor, t.variacion_interanual_corredor,
         b.fecha_inicio = MAX(b.fecha_inicio) OVER () AS es_ultimo_trimestre,
         DENSE_RANK() OVER (ORDER BY b.fecha_inicio DESC) <= 4 AS ultimos_4_trimestres
  FROM base b
  LEFT JOIN total_yoy t USING (fecha_inicio)
