      ('bronze_cnmc_precio_trimestral', 'Bronze CNMC Precio Medio Trimestral', 'Bronze L2', 3, 'Ingesta y Fuentes Externas', 'CSV del indicador de precio medio por trayecto y trimestre publicado por la CNMC. Es la base del precio recomendado - el precio real medido, no una estimación.', 'Registro original del CSV fuente', 'Trimestre, Empresa, Trayecto', 'Parquet (L2) / CSV (L1)', 'bronze_download -> raw_uploader -> parquet_converter', 'Trimestral', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ contenido_no_vacio</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ formato_declarado</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ tamano_minimo</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ cabecera_esperada</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ filas_minimas</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ cabecera_csv</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ registros_corruptos</span>', 'fuente:cnmc_precio_trimestral', '<span style="display:inline-block;background:#edf2f7;color:#2d3748;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;">silver:cnmc_precio_trimestral</span>', '-', 4),
      ('bronze_cnmc_viajeros_corredor', 'Bronze CNMC Viajeros por Corredor', 'Bronze L2', 3, 'Ingesta y Fuentes Externas', 'CSV trimestral de viajeros y plazas ofertadas de larga distancia de alta velocidad, desglosado por corredor y empresa. Es el total del corredor que la DTC reparte entre los días.', 'Registro original del CSV fuente', 'Trimestre, Corredor, Empresa', 'Parquet (L2) / CSV (L1)', 'bronze_download -> raw_uploader -> parquet_converter', 'Trimestral', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ contenido_no_vacio</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ formato_declarado</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ tamano_minimo</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ cabecera_esperada</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ filas_minimas</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ cabecera_csv</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ registros_corruptos</span>', 'fuente:cnmc_viajeros_corredor', '<span style="display:inline-block;background:#edf2f7;color:#2d3748;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;">silver:cnmc_viajeros_corredor</span>', '-', 4),
