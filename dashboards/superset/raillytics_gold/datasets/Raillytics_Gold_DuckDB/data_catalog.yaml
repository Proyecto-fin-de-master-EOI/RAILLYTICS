      ('aemet_barcelona_prat', 'Bronze AEMET Barcelona-El Prat', 'Bronze L2', 3, 'Ingesta y Fuentes Externas', 'Valores climatológicos diarios de la estación 0076 (Barcelona-El Prat) servidos por la API OpenData de AEMET. Es la cabecera este del corredor, la pareja de Madrid-Barajas.', 'Un día observado en la estación', 'fecha, indicativo', 'Parquet (L2) / JSON (L1)', 'bronze_download -> raw_uploader -> parquet_converter', 'Diaria', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ contenido_no_vacio</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ formato_declarado</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ registros_corruptos</span>', 'fuente:aemet_barcelona_prat', '-', '-', 4),
      ('aemet_madrid_barajas', 'Bronze AEMET Madrid-Barajas', 'Bronze L2', 3, 'Ingesta y Fuentes Externas', 'Valores climatológicos diarios de la estación 3195 (Madrid-Barajas) servidos por la API OpenData de AEMET. La tabla Silver meteo no sale de aquí - la construye `make meteo`, que vuelve a llamar a la API.', 'Un día observado en la estación', 'fecha, indicativo', 'Parquet (L2) / JSON (L1)', 'bronze_download -> raw_uploader -> parquet_converter', 'Diaria', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ contenido_no_vacio</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ formato_declarado</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ registros_corruptos</span>', 'fuente:aemet_madrid_barajas', '-', '-', 4),
      ('boe_calendario_laboral_2025', 'Bronze BOE Calendario Laboral 2025', 'Bronze L2', 3, 'Ingesta y Fuentes Externas', 'XML completo de la resolución del BOE que publica los festivos nacionales y por comunidad autónoma de 2025. La tabla Silver festivos la extrae `make festivos` parseando la tabla del XML.', 'Una disposición del BOE (el documento entero)', 'metadatos', 'Parquet (L2) / XML (L1)', 'bronze_download -> raw_uploader -> parquet_converter', 'Anual', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ contenido_no_vacio</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ formato_declarado</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ registros_corruptos</span>', 'fuente:boe_calendario_laboral_2025', '-', '-', 3),
      ('boe_calendario_laboral_2026', 'Bronze BOE Calendario Laboral 2026', 'Bronze L2', 3, 'Ingesta y Fuentes Externas', 'XML completo de la resolución del BOE que publica los festivos nacionales y por comunidad autónoma de 2026. Se ingieren dos años porque la predicción necesita el calendario del trimestre siguiente.', 'Una disposición del BOE (el documento entero)', 'metadatos', 'Parquet (L2) / XML (L1)', 'bronze_download -> raw_uploader -> parquet_converter', 'Anual', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ contenido_no_vacio</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ formato_declarado</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ registros_corruptos</span>', 'fuente:boe_calendario_laboral_2026', '-', '-', 3),
