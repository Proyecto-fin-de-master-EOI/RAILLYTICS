      ('ine_turismo_madrid_barcelona', 'Bronze INE Turismo Madrid-Barcelona', 'Bronze L2', 3, 'Ingesta y Fuentes Externas', 'Respuesta JSON de la API Tempus3 del INE con la serie mensual de turistas de Madrid a Barcelona (operación TMOV, tabla 53267). La tabla Silver turismo_mensual la construye `make turismo` llamando de nuevo a la API.', 'Una serie del INE, con sus observaciones anidadas', 'COD', 'Parquet (L2) / JSON (L1)', 'bronze_download -> raw_uploader -> parquet_converter', 'Mensual', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ contenido_no_vacio</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ formato_declarado</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ registros_corruptos</span>', 'fuente:ine_turismo_madrid_barcelona', '-', '-', 3),
