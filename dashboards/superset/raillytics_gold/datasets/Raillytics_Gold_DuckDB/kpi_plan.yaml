table_name: kpi_plan
main_dttm_col: null
description: 'Los KPI del plan del Sprint 2 con su objetivo al lado y si se cumple. Solo están los medibles con las fuentes
  disponibles; los que faltan (ocupación por franja horaria, precio recomendado, reducción de plazas vacías, detección automática
  de eventos y recuperación ante fallos) no tienen fuente, y el motivo de cada uno está escrito en el SQL del dataset. Dos
  avisos de lectura: el factor de ocupación lleva umbral del 80 % y no del 85 % del plan, porque se recalibró al fijar que
  la fórmula correcta es viajeros·km / plazas·km; y la mejora por variables externas sale NEGATIVA, que es un resultado y
  no un fallo.'
default_endpoint: null
offset: 0
cache_timeout: null
schema: null
catalog: null
sql: "SELECT\n    orden, kpi, familia, valor, objetivo, comparador, unidad, nota,\n    CASE\n        WHEN objetivo IS NULL\
  \ THEN NULL\n        WHEN comparador = '>=' THEN valor >= objetivo\n        WHEN comparador = '<=' THEN valor <= objetivo\n\
  \    END                                                        AS cumple,\n    CASE WHEN objetivo IS NULL THEN NULL ELSE\
  \ valor - objetivo END AS distancia_al_objetivo\nFROM (-- Los KPI del plan del Sprint 2, cada uno con su objetivo al lado\
  \ y si lo cumple.\n-- Una fila por KPI: es la vista que contesta «¿vamos bien?» sin abrir siete dashboards.\n--\n-- Solo\
  \ estan los MEDIBLES con las fuentes que hay. Los que faltan del plan y por que:\n--   ratio de aceptacion del precio recomendado\
  \  mide que parte de las recomendaciones adopta sin\n--       cambiarlas un revenue manager. Es un proceso humano de una\
  \ empresa que el proyecto no tiene,\n--       y es el unico KPI del plan que no se puede suplir con un supuesto: los demas\
  \ datos que\n--       faltan se presuponen para rellenar ENTRADAS, y este fabricaria la VALIDACION de nuestra\n--      \
  \ propia salida. Diria que el modelo acierta porque lo hemos escrito nosotros. En su hueco va\n--       el 12, que contrasta\
  \ la recomendacion contra el precio real de la CNMC, y el mecanismo que\n--       lo haria calculable esta montado: cada\
  \ recomendacion se guarda con sus entradas y la version\n--       de la regla que la produjo (gold/fact_precio_recomendado).\n\
  --   reduccion de plazas vacias                  hace falta una serie historica para medir la\n--       reduccion; el nivel\
  \ de partida es el KPI 9\n--   cobertura a eventos detectados              los eventos son un CSV curado a mano, no deteccion\n\
  --   tasa de recuperacion ante fallos de fuente  la ingesta no registra reintentos\nWITH ocupacion AS (\n    SELECT avg(ocupacion)\
  \ AS v\n    FROM read_parquet('s3://raillytics-gold/fact_ocupacion_diaria/*.parquet') WHERE plausible\n), revenue AS (\n\
  \    SELECT sum(ingresos_eur) / nullif(sum(plazas_ofertadas), 0) AS v\n    FROM read_parquet('s3://raillytics-gold/fact_mercado_trimestral/*.parquet')\n\
  \    WHERE fecha_inicio = (SELECT max(fecha_inicio) FROM read_parquet('s3://raillytics-gold/fact_mercado_trimestral/*.parquet'))\n\
  ), cobertura AS (\n    SELECT cobertura AS v FROM read_parquet('s3://raillytics-gold/fact_cobertura_ingesta/*.parquet')\n\
  \    ORDER BY fecha DESC LIMIT 1\n), completitud AS (\n    SELECT sum(filas_limpias) * 1.0 / nullif(sum(filas), 0) AS v\n\
  \    FROM read_parquet('s3://raillytics-gold/fact_completitud_silver/*.parquet')\n), fases AS (\n    -- Tiempo de cada fase\
  \ del pipeline en cada dia. Se suman las fases y NO se toma el lapso del dia\n    -- entero: ese incluiria todo lo que haya\
  \ corrido ese dia (predicciones, recalculos) y no mide el\n    -- pipeline. Lo que sale es el tiempo de PROCESO registrado,\
  \ que es menor que el reloj de pared\n    -- del orquestador (`make carga-e2e` dio 31,6 min) porque este espera ademas a\
  \ que los trabajos\n    -- de streaming se asienten, y esa espera no queda registrada como carga.\n    SELECT cast(inicio\
  \ AS DATE) AS dia, proceso,\n           date_diff('second', min(inicio), max(fin)) AS seg\n    FROM read_parquet('s3://raillytics-gold/_trazabilidad/cargas/*.parquet',\
  \ union_by_name = true)\n    WHERE proceso IN ('bronze_download', 'bronze_l1_raw_uploader', 'bronze_l2_parquet_converter',\n\
  \                      'silver_builder', 'gold_build')\n    GROUP BY 1, 2\n), completas AS (\n    -- Solo los dias con las\
  \ CINCO fases: un dia en el que solo corrio Gold no mide el recorrido.\n    SELECT dia, sum(seg) / 3600.0 AS v FROM fases\
  \ GROUP BY dia HAVING count(*) = 5\n), latencia AS (\n    SELECT v FROM completas ORDER BY dia DESC LIMIT 1\n), dtc AS (\n\
  \    -- Desviacion entre lo repartido entre los dias y el total del trimestre, en la ultima ejecucion.\n    SELECT abs(sum(viajeros_previstos)\
  \ - max(total_esperado)) * 1.0 / nullif(max(total_esperado), 0) AS v\n    FROM read_parquet('s3://raillytics-gold/fact_prediccion_demanda/*.parquet',\
  \ union_by_name = true)\n    WHERE run_id = (SELECT max(run_id) FROM read_parquet('s3://raillytics-gold/fact_prediccion_demanda/*.parquet',\
  \ union_by_name = true))\n), franja AS (\n    SELECT avg(CASE WHEN es_punta THEN ocupacion END) AS punta,\n           avg(CASE\
  \ WHEN NOT es_punta THEN ocupacion END) AS valle,\n           avg(CASE WHEN es_punta THEN plazas_vacias END) AS vacias\n\
  \    FROM read_parquet('s3://raillytics-gold/fact_ocupacion_franja/*.parquet') WHERE plausible\n), precio AS (\n    SELECT\
  \ avg(CASE WHEN plausible THEN precio_recomendado_eur END)              AS recomendado,\n           avg(CASE WHEN plausible\
  \ THEN cast(en_rango_observado AS INT) END)     AS en_rango\n    FROM read_parquet('s3://raillytics-gold/fact_precio_recomendado/*.parquet')\n\
  ), externas AS (\n    SELECT mejora_variables_externas_pp AS v\n    FROM read_parquet('s3://raillytics-gold/fact_metricas_modelo/*.parquet',\
  \ union_by_name = true)\n    WHERE mejora_variables_externas_pp IS NOT NULL\n    ORDER BY generado_en DESC LIMIT 1\n)\n\
  SELECT * FROM (\n    SELECT 1 AS orden, 'Factor de ocupación medio' AS kpi, 'negocio' AS familia,\n           (SELECT v\
  \ FROM ocupacion) AS valor, 0.80 AS objetivo, '>=' AS comparador, 'porcentaje' AS unidad,\n           'El plan decía 85\
  \ %; se recalibró a 80 % al fijar la fórmula por kilómetros' AS nota\n    UNION ALL SELECT 2, 'Ingreso por asiento ofertado',\
  \ 'negocio',\n           (SELECT v FROM revenue), NULL, 'seguimiento', 'euros',\n           'Sin umbral en el plan: es una\
  \ línea base para comparar'\n    UNION ALL SELECT 3, 'Cobertura de ingesta', 'pipeline',\n           (SELECT v FROM cobertura),\
  \ 1.00, '>=', 'porcentaje',\n           'Sobre las 9 entradas obligatorias del registro, no sobre las 13'\n    UNION ALL\
  \ SELECT 4, 'Completitud de Silver', 'pipeline',\n           (SELECT v FROM completitud), 0.98, '>=', 'porcentaje',\n  \
  \         'Filas sin ningún nulo NO controlado. Los huecos vienen de días que AEMET no publicó'\n    UNION ALL SELECT 5,\
  \ 'Latencia del pipeline', 'pipeline',\n           (SELECT v FROM latencia), 4.0, '<=', 'horas',\n           'Suma de las\
  \ cinco fases en el último día con recorrido completo. Es tiempo de proceso registrado; el reloj del orquestador es mayor\
  \ porque espera a que el streaming se asiente'\n    UNION ALL SELECT 6, 'Error de recalibración de la DTC', 'pipeline',\n\
  \           (SELECT v FROM dtc), 0.001, '<=', 'proporcion',\n           'Sale 0 exacto: el reparto usa fracciones y mayor\
  \ resto, no coma flotante'\n    UNION ALL SELECT 7, 'Ocupación en hora punta', 'negocio',\n           (SELECT punta FROM\
  \ franja), NULL, 'seguimiento', 'porcentaje',\n           'Mañana (6-9) y tarde (15-19). Los trenes por franja son dato\
  \ medido; el reparto de la demanda entre franjas es hipótesis'\n    UNION ALL SELECT 8, 'Ocupación en hora valle', 'negocio',\n\
  \           (SELECT valle FROM franja), NULL, 'seguimiento', 'porcentaje',\n           'Madrugada, media mañana, mediodía\
  \ y noche'\n    UNION ALL SELECT 9, 'Plazas vacías en hora punta', 'negocio',\n           (SELECT vacias FROM franja), NULL,\
  \ 'seguimiento', 'porcentaje',\n           'Base del KPI de reducción de plazas vacías: hace falta una serie histórica para\
  \ medir la reducción'\n    UNION ALL SELECT 10, 'Mejora de MAPE por variables externas', 'modelo',\n           (SELECT v\
  \ FROM externas), 1.5, '>=', 'puntos',\n           'Negativo: festivos, eventos y meteo EMPEORAN el modelo. La ocupación\
  \ es demanda entre oferta y los efectos se cancelan'\n    UNION ALL SELECT 11, 'Precio recomendado medio', 'negocio',\n\
  \           (SELECT recomendado FROM precio), NULL, 'seguimiento', 'euros',\n           'El precio base de la CNMC es dato\
  \ medido; la elasticidad que lo mueve es hipotesis declarada en reglas_demanda.yml'\n    UNION ALL SELECT 12, 'Recomendaciones\
  \ en el rango real', 'negocio',\n           (SELECT en_rango FROM precio), 0.80, '>=', 'porcentaje',\n           'Ocupa\
  \ el hueco del ratio de aceptacion: contrasta la recomendacion contra el recorrido de precios que ese operador ha puesto\
  \ de verdad, no contra una decision humana que no existe'\n) k\nWHERE valor IS NOT NULL) base\nORDER BY orden"
