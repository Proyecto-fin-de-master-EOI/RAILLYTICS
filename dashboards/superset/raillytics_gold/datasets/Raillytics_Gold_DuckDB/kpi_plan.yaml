table_name: kpi_plan
main_dttm_col: null
description: 'Los KPI del plan del Sprint 2 con su objetivo al lado y si se cumple. Solo están los medibles con las fuentes
  disponibles; los que faltan (ratio de aceptación del precio, reducción de plazas vacías, detección automática de eventos
  y recuperación ante fallos) no tienen fuente, y el motivo de cada uno está escrito en el SQL del dataset. Dos avisos de
  lectura: el factor de ocupación lleva umbral del 72 % y no del 85 % del plan, porque se recalibró al fijar que la fórmula
  correcta es viajeros·km / plazas·km; y la tabla son los KPI de NEGOCIO, los TÉCNICOS y el del modelo, cada uno en verde
  o en rojo según cumpla su objetivo: un KPI lo es se cumpla o no. Los de seguimiento salen sin color porque el plan no les
  puso umbral.'
default_endpoint: null
offset: 0
cache_timeout: null
schema: null
catalog: null
sql: |-
  SELECT
      orden, kpi, familia, valor, objetivo, comparador, unidad, nota,
      CASE
          WHEN objetivo IS NULL THEN NULL
          WHEN comparador = '>=' THEN valor >= objetivo
          WHEN comparador = '<=' THEN valor <= objetivo
      END                                                        AS cumple,
      CASE WHEN objetivo IS NULL THEN NULL ELSE valor - objetivo END AS distancia_al_objetivo,
      -- El semaforo de la tabla. Superset colorea columnas NUMERICAS, no booleanos ni texto, asi que
      -- `cumple` viaja tambien como 1 / 0, y los de seguimiento (sin umbral) se quedan en NULL y sin
      -- color: no es que fallen, es que el plan no les puso objetivo.
      CASE WHEN objetivo IS NULL THEN NULL
           WHEN comparador = '>=' AND valor >= objetivo THEN 1
           WHEN comparador = '<=' AND valor <= objetivo THEN 1
           ELSE 0 END                                             AS semaforo
  FROM (-- Los KPI del plan del Sprint 2, cada uno con su objetivo al lado y si lo cumple.
  -- Una fila por KPI: es la vista que contesta «¿vamos bien?» sin abrir siete dashboards.
  --
  -- Solo estan los MEDIBLES con las fuentes que hay. Los que faltan del plan y por que:
  --   ratio de aceptacion del precio recomendado  mide que parte de las recomendaciones adopta sin
  --       cambiarlas un revenue manager. Es un proceso humano de una empresa que el proyecto no tiene,
  --       y es el unico KPI del plan que no se puede suplir con un supuesto: los demas datos que
  --       faltan se presuponen para rellenar ENTRADAS, y este fabricaria la VALIDACION de nuestra
  --       propia salida. Diria que el modelo acierta porque lo hemos escrito nosotros. En su hueco va
  --       el 12, que contrasta la recomendacion contra el precio real de la CNMC, y el mecanismo que
  --       lo haria calculable esta montado: cada recomendacion se guarda con sus entradas y la version
  --       de la regla que la produjo (gold/fact_precio_recomendado).
  --   (la reduccion de plazas vacias ya esta: KPI 15, con el aviso de que con 6 meses de serie
  --    mide sobre todo estacionalidad)
  --   cobertura a eventos detectados              los eventos son un CSV curado a mano, no deteccion
  --   (la tasa de recuperacion ante fallos de fuente ya esta: es el KPI 14. La ingesta reintenta
  --    lo transitorio y escribe los intentos en el registro de cargas)
  WITH traza AS MATERIALIZED (
      -- UN SOLO escaneo de la trazabilidad para todo lo que sale de ella: las dos latencias, la
      -- ventana de la ultima carga y la tasa de recuperacion. Son ~170 ficheros pequenos en MinIO y el
      -- DuckDB del contenedor de Superset va con 512 MB y 2 hilos, asi que leerlos tres veces se
      -- notaba de verdad. MATERIALIZED obliga a calcularlo una vez en vez de repetir la subconsulta en
      -- cada sitio donde se usa.
      SELECT run_id, proceso, tabla, estado, inicio, fin, duracion_s, parametros
      FROM read_parquet('s3://raillytics-gold/_trazabilidad/cargas/*.parquet', union_by_name = true)
  ), ocupacion AS (
      SELECT avg(ocupacion) AS v
      FROM read_parquet('s3://raillytics-gold/fact_ocupacion_diaria/*.parquet') WHERE plausible
  ), revenue AS (
      SELECT sum(ingresos_eur) / nullif(sum(plazas_ofertadas), 0) AS v
      FROM read_parquet('s3://raillytics-gold/fact_mercado_trimestral/*.parquet')
      WHERE fecha_inicio = (SELECT max(fecha_inicio) FROM read_parquet('s3://raillytics-gold/fact_mercado_trimestral/*.parquet'))
  ), cobertura AS (
      SELECT cobertura AS v FROM read_parquet('s3://raillytics-gold/fact_cobertura_ingesta/*.parquet')
      ORDER BY fecha DESC LIMIT 1
  ), completitud AS (
      SELECT sum(filas_limpias) * 1.0 / nullif(sum(filas), 0) AS v
      FROM read_parquet('s3://raillytics-gold/fact_completitud_silver/*.parquet')
  ), ventana AS (
      -- La ultima carga COMPLETA registrada: `scripts/carga_e2e.py` deja su reloj de pared al
      -- terminar. Solo las que empezaron por el principio: reanudar con `--desde gold` tambien deja
      -- fila, pero eso no es una carga completa.
      SELECT inicio, fin, duracion_s FROM traza
      WHERE proceso = 'carga_e2e'
        AND regexp_extract(parametros, '"desde":\s*"(\w+)"', 1) = 'infra'
      ORDER BY inicio DESC LIMIT 1
  ), fases AS (
      -- Tiempo de cada fase del pipeline en cada dia. UN SOLO escaneo de la trazabilidad, del que
      -- cuelgan las dos latencias: son 170 ficheros pequenos y leerlos dos veces se notaba de verdad
      -- (la consulta pasaba de 120 s en Superset, que va con 512 MB y 2 hilos, y las graficas daban
      -- timeout).
      --
      -- Se suman las fases y NO se toma el lapso del dia entero: ese incluiria todo lo que haya
      -- corrido ese dia (predicciones, recalculos) y no mide el pipeline. Lo que sale es el tiempo de
      -- PROCESO registrado, que es menor que el reloj de pared del orquestador porque este espera
      -- ademas a que los trabajos de streaming se asienten, y esa espera no queda registrada como
      -- carga: el reloj de pared es el KPI 13 y esto es su desglose por dentro.
      --
      -- Y se acota a la ULTIMA CARGA COMPLETA, no al dia. Sin acotar, una fase que corre dos veces el
      -- mismo dia se mide de la primera vez a la ultima y se cuentan las horas de nada que hay en
      -- medio: el 2026-10-18 el DAG programado descargo a las 00:00 y la cadena se lanzo a mano a las
      -- 08:20, y el KPI daba 8,4 h de los que 8,3 eran una descarga que no estaba descargando. Pasa
      -- cualquier dia que el DAG corra y ademas se lance la cadena a mano, que es lo normal mientras
      -- se desarrolla.
      --
      -- Si no hay ninguna carga completa registrada, se queda con todo lo del dia, que es lo que
      -- habia antes: mejor un numero flojo que ningun numero.
      SELECT cast(inicio AS DATE) AS dia, proceso,
             date_diff('second', min(inicio), max(fin)) AS seg
      FROM traza
      WHERE proceso IN ('bronze_download', 'bronze_l1_raw_uploader', 'bronze_l2_parquet_converter',
                        'silver_builder', 'referencia_oferta_diaria', 'referencia_oferta_franja',
                        'referencia_ml_ocupacion_diaria', 'silver_sample', 'gold_build',
                        'calidad_cobertura_ingesta', 'calidad_completitud_silver', 'ml_metricas',
                        'ml_ocupacion_franja', 'precio_recomendado')
        AND (NOT EXISTS (SELECT 1 FROM ventana)
             OR inicio BETWEEN (SELECT inicio FROM ventana) AND (SELECT fin FROM ventana))
      GROUP BY 1, 2
  ), completas AS (
      -- Las CINCO de Spark y Airflow. Solo los dias que las tienen todas: un dia en el que solo corrio
      -- Gold no mide el recorrido.
      SELECT dia, sum(seg) / 3600.0 AS v FROM fases
      WHERE proceso IN ('bronze_download', 'bronze_l1_raw_uploader', 'bronze_l2_parquet_converter',
                        'silver_builder', 'gold_build')
      GROUP BY dia HAVING count(*) = 5
  ), latencia AS (
      SELECT v FROM completas ORDER BY dia DESC LIMIT 1
  ), latencia_carga AS (
      -- Latencia de la carga COMPLETA: el reloj de pared del orquestador, que lo registra el propio
      -- `scripts/carga_e2e.py` al terminar.
      --
      -- Antes se sumaban las 14 fases y se exigia que estuvieran todas. No valia: una fase sin trabajo
      -- que hacer no deja fila (le paso a `silver_builder` el 2026-10-14, que corrio sin nada nuevo
      -- que escribir) y entonces el KPI no aparecia nunca. Ademas el reloj de pared es lo que de
      -- verdad significa «cuanto tarda la carga»: incluye esperar a que los streams se asienten, que
      -- ninguna fase ve.
      SELECT duracion_s / 3600.0 AS v FROM ventana
  ), dtc AS (
      -- Error de recalibracion de la DTC: lo repartido entre los dias contra el total del trimestre,
      -- en la ultima ejecucion de la prediccion. Tiene que ser cero salvo redondeo (la DTC reparte
      -- con Fraction y reparte el resto por el metodo del mayor resto), asi que el umbral es 0.001:
      -- si se mueve de ahi, el reparto ha dejado de cuadrar con su propio total.
      SELECT abs(sum(viajeros_previstos) - max(total_esperado)) * 1.0 / nullif(max(total_esperado), 0) AS v
      FROM read_parquet('s3://raillytics-gold/fact_prediccion_demanda/*.parquet', union_by_name = true)
      WHERE run_id = (SELECT max(run_id) FROM read_parquet('s3://raillytics-gold/fact_prediccion_demanda/*.parquet', union_by_name = true))
  ), franja AS (
      -- Ocupacion media de hora punta y de hora valle, y plazas vacias en punta. Solo las filas
      -- plausibles: las que no lo son llevan la marca precisamente para no promediarlas.
      SELECT avg(CASE WHEN es_punta THEN ocupacion END)      AS punta,
             avg(CASE WHEN NOT es_punta THEN ocupacion END)  AS valle,
             avg(CASE WHEN es_punta THEN plazas_vacias END)  AS vacias
      FROM read_parquet('s3://raillytics-gold/fact_ocupacion_franja/*.parquet') WHERE plausible
  ), descargas AS (
      -- Tasa de recuperacion ante fallos de fuente. `intentos` lo escribe el DAG en los parametros de
      -- cada descarga (ver dags/ingesta_data_sources.py): la ingesta reintenta lo TRANSITORIO —un
      -- corte de red, un timeout, un 5xx— y no lo que no se arregla reintentando (un 4xx, o un fichero
      -- que los quality gates rechazan porque la fuente publica otra cosa).
      --
      -- Se lee con regexp y no con las funciones JSON a proposito: asi no depende de que la extension
      -- json este cargada en el DuckDB del contenedor de Superset.
      SELECT cast(inicio AS DATE)                                         AS dia,
             tabla                                                        AS fuente,
             max(estado = 'ok')                                           AS acabo_bien,
             max(coalesce(try_cast(regexp_extract(parametros, '"intentos":\s*(\d+)', 1) AS INTEGER), 1)) AS intentos
      FROM traza
      WHERE proceso = 'bronze_download'
      GROUP BY 1, 2
  ), recuperacion AS (
      -- Un fallo es: o la descarga acabo en error, o hizo falta mas de un intento. De esos, se
      -- recuperaron los que acabaron bien. Sin fallos no hay tasa (NULL), que es lo honesto: no se
      -- puede presumir de recuperarse de nada.
      SELECT sum(CASE WHEN acabo_bien AND intentos > 1 THEN 1 ELSE 0 END) * 1.0
             / nullif(sum(CASE WHEN intentos > 1 OR NOT acabo_bien THEN 1 ELSE 0 END), 0) AS v
      FROM descargas
  ), vacias AS (
      -- Reduccion de plazas vacias en hora punta, en PUNTOS PORCENTUALES: los ultimos 30 dias de la
      -- serie menos los 30 anteriores. Negativo = se han reducido.
      --
      -- AVISO QUE VIAJA CON EL NUMERO, porque sin el enganya: la serie son 6 meses de 2026 y el
      -- corredor es MUY estacional (el T1 va al 73,8 % de ocupacion media y el T2 al 83,2 %). Con dos
      -- ventanas consecutivas, buena parte de la diferencia es la estacion del ano y no la gestion.
      -- Esto se vuelve un KPI de gestion cuando haya 12 meses y se pueda comparar cada mes con el
      -- mismo mes del ano anterior; mientras tanto mide la tendencia reciente y se dice asi.
      SELECT
          avg(CASE WHEN fecha > (SELECT max(fecha) FROM read_parquet('s3://raillytics-gold/fact_ocupacion_franja/*.parquet')) - INTERVAL 30 DAY
                   THEN plazas_vacias END)                                                    AS reciente,
          avg(CASE WHEN fecha <= (SELECT max(fecha) FROM read_parquet('s3://raillytics-gold/fact_ocupacion_franja/*.parquet')) - INTERVAL 30 DAY
                    AND fecha > (SELECT max(fecha) FROM read_parquet('s3://raillytics-gold/fact_ocupacion_franja/*.parquet')) - INTERVAL 60 DAY
                   THEN plazas_vacias END)                                                    AS anterior
      FROM read_parquet('s3://raillytics-gold/fact_ocupacion_franja/*.parquet')
      WHERE es_punta AND plausible
  ), precio AS (
      SELECT avg(CASE WHEN plausible THEN precio_recomendado_eur END)              AS recomendado,
             avg(CASE WHEN plausible THEN cast(en_rango_observado AS INT) END)     AS en_rango
      FROM read_parquet('s3://raillytics-gold/fact_precio_recomendado/*.parquet')
  ), externas AS (
      SELECT mejora_variables_externas_pp AS v
      FROM read_parquet('s3://raillytics-gold/fact_metricas_modelo/*.parquet', union_by_name = true)
      WHERE mejora_variables_externas_pp IS NOT NULL
      ORDER BY generado_en DESC LIMIT 1
  )
  SELECT * FROM (
      SELECT 1 AS orden, 'Factor de ocupación medio' AS kpi, 'negocio' AS familia,
             -- Recorrido del umbral: 85 % (el del plan) -> 80 % -> 72 %, el vigente. Ver el comentario
             -- de UMBRAL_OCUPACION: con 80 % saltaria en 8 de 14 trimestres porque la serie tiene
             -- 9,4 puntos entre T1 y T2, asi que mediria estacionalidad y no anomalias.
             (SELECT v FROM ocupacion) AS valor, 0.72 AS objetivo, '>=' AS comparador, 'porcentaje' AS unidad,
             'El plan decia 85 %. Esta en 72 %: por la formula por kilometros primero, y despues porque la serie es muy estacional y un umbral plano por encima del 74 % avisa de que es invierno, no de una anomalia. 72 % es el percentil 10 de 2023-2026' AS nota
      UNION ALL SELECT 2, 'Ingreso por asiento ofertado', 'negocio',
             (SELECT v FROM revenue), NULL, 'seguimiento', 'euros',
             'Sin umbral en el plan: es una línea base para comparar'
      UNION ALL SELECT 3, 'Cobertura de ingesta', 'pipeline',
             (SELECT v FROM cobertura), 1.00, '>=', 'porcentaje',
             'Sobre las 9 entradas obligatorias del registro, no sobre las 13'
      UNION ALL SELECT 4, 'Completitud de Silver', 'pipeline',
             (SELECT v FROM completitud), 0.98, '>=', 'porcentaje',
             'Filas sin ningún nulo NO controlado. Los huecos vienen de días que AEMET no publicó'
      UNION ALL SELECT 5, 'Latencia del pipeline', 'pipeline',
             (SELECT v FROM latencia), 4.0, '<=', 'horas',
             'Las cinco fases de Spark y Airflow (descarga, L1, L2, Silver y Gold) en el ultimo dia que las tiene todas. No incluye los pasos que escribe Python: esos van en el KPI 13'
      UNION ALL SELECT 6, 'Error de recalibración de la DTC', 'pipeline',
             (SELECT v FROM dtc), 0.001, '<=', 'proporcion',
             'Sale 0 exacto: el reparto usa fracciones y mayor resto, no coma flotante'
      UNION ALL SELECT 7, 'Ocupación en hora punta', 'negocio',
             (SELECT punta FROM franja), NULL, 'seguimiento', 'porcentaje',
             'Mañana (6-9) y tarde (15-19). Los trenes por franja son dato medido; el reparto de la demanda entre franjas es hipótesis'
      UNION ALL SELECT 8, 'Ocupación en hora valle', 'negocio',
             (SELECT valle FROM franja), NULL, 'seguimiento', 'porcentaje',
             'Madrugada, media mañana, mediodía y noche'
      UNION ALL SELECT 9, 'Plazas vacías en hora punta', 'negocio',
             (SELECT vacias FROM franja), NULL, 'seguimiento', 'porcentaje',
             'Base del KPI de reducción de plazas vacías: hace falta una serie histórica para medir la reducción'
      -- Un KPI lo es se cumpla o no, asi que este se queda aunque salga en rojo: -0,76 pp contra un
      -- umbral de 1,5. Festivos, eventos y meteo EMPEORAN el modelo, porque la ocupacion es demanda
      -- entre oferta y los efectos se cancelan al dividir. Es un resultado, no un fallo del pipeline, y
      -- esta argumentado en docs/hipotesis.md como la hipotesis H3.
      UNION ALL SELECT 10, 'Mejora de MAPE por variables externas', 'modelo',
             (SELECT v FROM externas), 1.5, '>=', 'puntos',
             'Negativo: festivos, eventos y meteo EMPEORAN el modelo. La ocupacion es demanda entre oferta y los efectos se cancelan'
      UNION ALL SELECT 11, 'Precio recomendado medio', 'negocio',
             (SELECT recomendado FROM precio), NULL, 'seguimiento', 'euros',
             'El precio base de la CNMC es dato medido; la elasticidad que lo mueve es hipotesis declarada en reglas_demanda.yml'
      UNION ALL SELECT 12, 'Recomendaciones en el rango real', 'negocio',
             (SELECT en_rango FROM precio), 0.80, '>=', 'porcentaje',
             'Ocupa el hueco del ratio de aceptacion: contrasta la recomendacion contra el recorrido de precios que ese operador ha puesto de verdad, no contra una decision humana que no existe'
      UNION ALL SELECT 13, 'Latencia de la carga completa', 'pipeline',
             (SELECT v FROM latencia_carga), 4.0, '<=', 'horas',
             'Reloj de pared de `make carga-e2e` entero, registrado por el propio orquestador. El KPI 5 mide otra cosa: solo las cinco fases de Spark y Airflow. Sale en blanco hasta que se corra una carga completa'
      UNION ALL SELECT 14, 'Recuperacion ante fallos de fuente', 'pipeline',
             (SELECT v FROM recuperacion), NULL, 'seguimiento', 'porcentaje',
             'Descargas que fallaron y acabaron bien sobre las que fallaron. La ingesta reintenta lo transitorio (red, timeout, 5xx) y no lo que no se arregla reintentando. Sale en blanco si no ha fallado ninguna: sin fallos no hay tasa'
      UNION ALL SELECT 15, 'Reduccion de plazas vacias en punta', 'negocio',
             (SELECT (reciente - anterior) * 100 FROM vacias), NULL, 'seguimiento', 'puntos',
             'Ultimos 30 dias menos los 30 anteriores. Negativo = se reducen. OJO: con 6 meses de serie esto mide sobre todo ESTACIONALIDAD (el T1 del corredor va 9 puntos por debajo del T2); sera un KPI de gestion cuando haya 12 meses y se compare cada mes con el mismo del ano anterior'
  ) k
  -- Sin filtrar por valor: un KPI que no se puede medir hoy se queda EN BLANCO, no desaparece.
  -- Si se filtra, el 14 (recuperacion ante fallos) solo existe los dias en que algo ha fallado, y
  -- un indicador que aparece y desaparece no se puede leer: no se distingue «hoy no ha fallado
  -- nada» de «esto se ha roto». Lo dice la propia nota del 14: sale en blanco si no ha fallado
  -- ninguna.
  ) base
  ORDER BY orden
