      ('gold:fact_turismo_mensual', 'Gold', 6, 'fact_turismo_mensual', 'Fact_Turismo_Mensual: turistas que se mueven de Madrid a cada provincia destino, mes a mes (INE, datos reales).', 'src/main/resources/gold/fact_turismo_mensual.sql', true),
      ('gold:fact_viajeros', 'Gold', 6, 'fact_viajeros', 'Fact_Viajeros: viajes diarios por par origen-destino, línea y operador.', 'src/main/resources/gold/fact_viajeros.sql', true),
      ('dataset:backtest_nivel', 'Dataset de Superset', 7, 'backtest_nivel', 'Backtest de la regla de nivel de la predicción con los trimestres reales de la CNMC. Datos REALES de la CNMC (no sintéticos), solo el corredor AVE Madrid–Barcelona. En la demanda Avlo va dentro de Renfe (la CNMC no la separa); en los precios aparece por separado hasta 2025-T4. «Viajeros por plaza ofertada» no es ocupación: un asiento sirve a varios tramos.', '', false),
      ('dataset:cobertura_ingesta', 'Dataset de Superset', 7, 'cobertura_ingesta', 'KPI de completitud de la ingesta que pide el plan del Sprint 2: fuentes del registro descargadas correctamente sobre el total de fuentes declaradas, con umbral del 98 %. No confundir con el «% de quality gates OK»: aquel mide cuántas reglas se cumplen y este cuánto dato falta. Se pueden tener todos los gates en verde y faltar meses de datos. El denominador es el registro de HOY, así que un día anterior al alta de una fuente nueva sale por debajo del 100 %: compara «fuentes intentadas» con «esperadas» para distinguir un fallo real de un registro que ha crecido.', '', false),
      ('dataset:mercado_trimestral', 'Dataset de Superset', 7, 'mercado_trimestral', 'Mercado trimestral del corredor AVE Madrid–Barcelona por operador. Datos REALES de la CNMC (no sintéticos), solo el corredor AVE Madrid–Barcelona. En la demanda Avlo va dentro de Renfe (la CNMC no la separa); en los precios aparece por separado hasta 2025-T4. «Viajeros por plaza ofertada» no es ocupación: un asiento sirve a varios tramos, y por eso llega a pasar del 100%. La ocupación real es «Coeficiente de ocupación», que pondera por distancia (viajeros·km / plazas·km).', '', false),
      ('dataset:metricas_modelo', 'Dataset de Superset', 7, 'metricas_modelo', 'Métricas de cada entrenamiento del modelo de ocupación diaria. Lo que hay que mirar NO es el MAPE de partición única (8,0 %, que cumple el umbral del plan pero depende de qué semanas tocaron): es el de validación temporal frente a su referencia trivial. Hoy: 10,1 % contra 10,3 %, es decir que empata con predecir la media de lo ya visto. El intervalo del 90 % cubre el 78 % y mide 24,6 puntos de ocupación, o sea que es ancho Y se queda corto: el modelo es genuinamente incierto. Y el aviso de fondo: el objetivo lo generan las reglas de reparto del propio proyecto, así que esto mide reproducir nuestras reglas, no acertar la demanda real.', '', false),
      ('dataset:ocupacion_diaria', 'Dataset de Superset', 7, 'ocupacion_diaria', 'Coeficiente de ocupación diaria del corredor AVE Madrid–Barcelona: viajeros·km / plazas·km. MITAD REAL — el total del trimestre es de la CNMC, pero el reparto entre los días lo hacen las reglas del proyecto, así que la ocupación de un día concreto NO es una medición. No es «viajeros por plaza»: un asiento se vende por tramos, así que el ratio de cabezas pasa del 100 % legítimamente; medido en km, el 100 % sí es un techo real. «Plausible» marca los días que no lo pasan, y 21 de los 25 imposibles son fin de semana porque el NAP da trenes y no plazas y las composiciones dobles no se ven: cualquier media debería filtrar por plausible o decir que no lo hace.', '', false),
      ('dataset:ocupacion_franja', 'Dataset de Superset', 7, 'ocupacion_franja', 'Ocupación por franja horaria. Los TRENES por franja son dato medido —la hora de salida del GTFS del NAP— pero el reparto de la demanda entre franjas es una HIPÓTESIS declarada en config/reglas_demanda.yml: dentro del día el operador elige libremente el horario, así que la oferta sigue a la demanda y no queda señal con la que medir el diferencial de ocupación. Los KPI de hora punta y hora valle heredan esa condición. El perfil de oferta sí es real y tiene un dato interesante: Renfe concentra en las puntas y OUIGO reparte casi plano.', '', false),
      ('dataset:oferta_diaria', 'Dataset de Superset', 7, 'oferta_diaria', 'Trenes que circulan cada día en el corredor, por operador (NAP, datos REALES). Es la única serie diaria medida del proyecto, y con ella se calibró el coeficiente por día de la semana del reparto de la predicción. AVISO: son TRENES, no plazas — una composición doble cuenta como un tren, así que esto es servicio y no capacidad. Y falta Iryo, que no publica horarios en el NAP, así que la oferta cubre Renfe y OUIGO pero no el corredor completo. Filtrar por «cobertura completa» o decir que no se filtra: un día al que le falta un operador no es menos servicio, es dato incompleto.', '', false),
      ('dataset:precio_medio_mensual', 'Dataset de Superset', 7, 'precio_medio_mensual', 'Precio medio mensual por trayecto del corredor AVE Madrid–Barcelona por operador. Datos REALES de la CNMC (no sintéticos), solo el corredor AVE Madrid–Barcelona. En la demanda Avlo va dentro de Renfe (la CNMC no la separa); en los precios aparece por separado hasta 2025-T4. «Viajeros por plaza ofertada» no es ocupación: un asiento sirve a varios tramos.', '', false),
      ('dataset:precio_medio_trimestral', 'Dataset de Superset', 7, 'precio_medio_trimestral', 'Precio medio trimestral por trayecto del corredor AVE Madrid–Barcelona por operador. Datos REALES de la CNMC (no sintéticos), solo el corredor AVE Madrid–Barcelona. En la demanda Avlo va dentro de Renfe (la CNMC no la separa); en los precios aparece por separado hasta 2025-T4. «Viajeros por plaza ofertada» no es ocupación: un asiento sirve a varios tramos.', '', false),
      ('dataset:precio_recomendado', 'Dataset de Superset', 7, 'precio_recomendado', 'Precio recomendado por día, franja y operador. El precio base y el rango al que se acota la recomendación son DATO MEDIDO de la CNMC; la elasticidad es una HIPÓTESIS declarada en config/reglas_demanda.yml, donde está el intento de estimarla (−0,299 con error estándar 0,453: ruido) y por qué no se puede con estas fuentes. Con la referencia medida la regla es neutra en promedio: lo que señala es qué días y franjas van por encima o por debajo de la media, no que el nivel de precios del corredor esté mal. El ratio de aceptación del plan NO está aquí porque mide un proceso humano —qué recomendaciones adopta un revenue manager— que el proyecto no tiene; lo que sí queda montado es el mecanismo que lo haría calculable.', '', false),
      ('dataset:prediccion_demanda', 'Dataset de Superset', 7, 'prediccion_demanda', 'Predicción diaria de demanda del corredor AVE Madrid–Barcelona (raillytics.prediccion): una fila por día y ejecución, leída de s3://raillytics-gold/fact_prediccion_demanda/.', '', false),
      ('dataset:puntualidad_servicios', 'Dataset de Superset', 7, 'puntualidad_servicios', 'Un servicio (tren) del corredor AVE Madrid–Barcelona (línea AVE-MAD-BCN) por fila con su operador y su retraso en llegada: Fact_Puntualidad ⋈ dimensiones, leído con DuckDB del Parquet de Gold en MinIO. Solo se muestra el corredor.', '', false),
      ('dataset:turismo_mensual', 'Dataset de Superset', 7, 'turismo_mensual', 'Turistas que se mueven de Madrid a cada provincia destino, mes a mes (INE, operación TMOV, tabla 53267, datos REALES estimados por posición de teléfonos móviles). Es el único dato de nivel MENSUAL del proyecto, y de él sale el coeficiente «base_mes» del reparto diario de la predicción. QUÉ NO SE PUEDE CONCLUIR: son viajes en TODOS los medios de transporte, no solo en tren, y «turista» implica pernoctación, así que la ida y vuelta en el día no entra. Se usa la FORMA (cuota del mes dentro de su trimestre), no el nivel. Atribución obligatoria: «Elaboración propia con datos extraídos del sitio web del INE: www.ine.es».', '', false),
      ('dataset:viajeros_diarios', 'Dataset de Superset', 7, 'viajeros_diarios', 'Viajeros diarios del corredor AVE Madrid–Barcelona (línea AVE-MAD-BCN) por par origen-destino y operador: Fact_Viajeros ⋈ Dim_Fecha, Dim_Estacion, Dim_Linea y Dim_Operador, leídos con DuckDB del Parquet de Gold en MinIO. Solo se muestra el corredor.', '', false),
      ('dashboard:demanda-ferroviaria', 'Dashboard', 8, 'demanda-ferroviaria', 'Demanda ferroviaria · AVE Madrid–Barcelona', '', false),
      ('dashboard:mercado-corredor', 'Dashboard', 8, 'mercado-corredor', 'Mercado del corredor · AVE Madrid–Barcelona', '', false),
      ('dashboard:panel-direccion', 'Dashboard', 8, 'panel-direccion', 'Panel de dirección · Corredor Madrid–Barcelona', '', false),
      ('dashboard:prediccion-demanda', 'Dashboard', 8, 'prediccion-demanda', 'Predicción de demanda · AVE Madrid–Barcelona', '', false),
      ('dashboard:puntualidad', 'Dashboard', 8, 'puntualidad', 'Puntualidad · AVE Madrid–Barcelona', '', false)),
  carga AS (
      SELECT CASE proceso
      WHEN 'bronze_download' THEN 'staging:' || tabla
      WHEN 'bronze_l1_raw_uploader' THEN 'l1:' || tabla
      WHEN 'bronze_l2_parquet_converter' THEN 'l2:' || split_part(tabla, '/', 1)
      WHEN 'silver_builder' THEN 'silver:' || tabla
      WHEN 'silver_sample' THEN 'silver:' || tabla
      WHEN 'gold_build' THEN 'gold:' || tabla
      WHEN 'prediccion_muestra' THEN 'l2:muestra_' || tabla
      WHEN 'prediccion_demanda' THEN CASE WHEN tabla = 'fact_prediccion_demanda' THEN 'gold:' ELSE 'pred:' END || tabla
      WHEN 'referencia_festivos' THEN 'silver:' || tabla
      WHEN 'referencia_meteo' THEN 'silver:' || tabla
      WHEN 'referencia_turismo_mensual' THEN 'silver:' || tabla
      WHEN 'referencia_oferta_diaria' THEN 'silver:' || tabla
      WHEN 'referencia_oferta_franja' THEN 'silver:' || tabla
      WHEN 'referencia_ml_ocupacion_diaria' THEN 'silver:' || tabla
      WHEN 'ml_metricas' THEN 'gold:' || tabla
      WHEN 'ml_ocupacion_franja' THEN 'gold:' || tabla
      WHEN 'precio_recomendado' THEN 'gold:' || tabla
      WHEN 'calidad_completitud_silver' THEN 'gold:' || tabla
      WHEN 'calidad_cobertura_ingesta' THEN 'gold:' || tabla
    END AS nodo, run_id, proceso, estado, filas, duracion_s, error, parametros,
             timezone('Europe/Madrid', timezone('UTC', inicio)) AS inicio
      FROM read_parquet('s3://raillytics-gold/_trazabilidad/cargas/*.parquet', union_by_name = true)
  ),
  -- Una fila por (nodo, ejecución): un ZIP de L2 registra un fichero por fila y se suman sus filas.
  por_run AS (
      SELECT nodo, run_id, any_value(proceso) AS proceso, min(inicio) AS inicio, sum(filas) AS filas, sum(duracion_s) AS duracion_s,
             CASE WHEN bool_or(estado = 'error') THEN 'error' ELSE 'ok' END AS estado,
             string_agg(DISTINCT error, ' | ') AS error, any_value(parametros) AS parametros
      FROM carga WHERE nodo IS NOT NULL GROUP BY nodo, run_id
  ),
  ultimo AS (SELECT * FROM por_run QUALIFY row_number() OVER (PARTITION BY nodo ORDER BY inicio DESC) = 1),
  ultimo_proceso AS (SELECT * FROM por_run QUALIFY row_number() OVER (PARTITION BY nodo, proceso ORDER BY inicio DESC) = 1),
  historico AS (
      SELECT nodo, count(*) AS n_cargas, sum(CASE WHEN estado = 'error' THEN 1 ELSE 0 END) AS n_errores FROM por_run GROUP BY nodo
  ),
  gate AS (
      SELECT CASE
      WHEN proceso = 'bronze_download' THEN 'staging:' || tabla
      WHEN proceso = 'bronze_l1_raw_uploader' THEN 'l1:' || tabla
      WHEN proceso = 'bronze_l2_parquet_converter' THEN 'l2:' || split_part(tabla, '/', 1)
      WHEN proceso = 'prediccion_demanda' THEN 'pred:' || tabla
      WHEN starts_with(tabla, 'silver_') THEN 'silver:' || substr(tabla, 8)
      WHEN starts_with(tabla, 'gold_') THEN 'gold:' || substr(tabla, 6)
    END AS nodo, gate, tipo, severidad, resultado, valor, umbral, detalle, run_id,
             timezone('Europe/Madrid', timezone('UTC', inicio)) AS inicio
      FROM read_parquet('s3://raillytics-gold/_trazabilidad/calidad/*.parquet', union_by_name = true)
  ),
  -- Solo cuenta la ÚLTIMA evaluación de cada regla de cada nodo.
  gate_ultima AS (SELECT * FROM gate WHERE nodo IS NOT NULL QUALIFY row_number() OVER (PARTITION BY nodo, gate ORDER BY inicio DESC) = 1),
  resumen_gates AS (
      SELECT nodo, count(*) AS gates_total,
             sum(CASE WHEN resultado = 'ok' THEN 1 ELSE 0 END) AS gates_ok,
             sum(CASE WHEN resultado <> 'ok' AND severidad = 'bloqueante' THEN 1 ELSE 0 END) AS gates_fallidos,
             sum(CASE WHEN resultado <> 'ok' AND severidad <> 'bloqueante' THEN 1 ELSE 0 END) AS gates_aviso
      FROM gate_ultima GROUP BY nodo
  )
  SELECT
      n.nodo, n.capa, n.orden_capa, n.nombre, n.descripcion, n.ruta,
      CASE
          WHEN NOT n.trazable THEN 'no aplica'
          WHEN u.nodo IS NULL AND g.nodo IS NULL THEN 'sin ejecutar'
          WHEN u.estado = 'error' OR coalesce(g.gates_fallidos, 0) > 0 THEN 'error'
          WHEN coalesce(g.gates_aviso, 0) > 0 THEN 'aviso'
          ELSE 'ok'
      END AS estado,
      u.inicio AS ultima_carga, u.run_id AS ultimo_run, u.filas AS ultimas_filas, u.duracion_s, u.error AS ultimo_error,
      coalesce(h.n_cargas, 0) AS n_cargas, coalesce(h.n_errores, 0) AS n_errores,
      coalesce(g.gates_total, 0) AS gates_total, coalesce(g.gates_ok, 0) AS gates_ok,
      coalesce(g.gates_fallidos, 0) AS gates_fallidos, coalesce(g.gates_aviso, 0) AS gates_aviso
  FROM nodos n
  LEFT JOIN ultimo u ON u.nodo = n.nodo
  LEFT JOIN historico h ON h.nodo = n.nodo
  LEFT JOIN resumen_gates g ON g.nodo = n.nodo
  ORDER BY n.orden_capa, n.nodo
