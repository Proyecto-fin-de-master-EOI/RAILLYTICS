schema: null
catalog: null
sql: "-- Fact_Ocupacion_Diaria ⋈ Dim_Fecha, con los trenes del día al lado para poder leer numerador y denominador juntos.\n-- MITAD REAL: ocupacion = viajeros·km / plazas·km. El total del TRIMESTRE es\
  \ de la CNMC, pero el reparto\n-- entre los días lo hacen las reglas del proyecto, así que la ocupación de un día NO es una medición.\n-- `plausible` marca los días que no pasan del 100 %. 21 de los 25\
  \ imposibles son fin de semana, y no es\n-- un fallo de la fuente: el NAP da trenes y no plazas, así que las composiciones dobles no se ven.\nSELECT\n    f.fecha,\n    f.fecha_id,\n    f.corredor,\n \
  \   f.ocupacion,\n    f.plausible,\n    f.festivo, f.vispera, f.puente, f.regreso, f.evento, f.junto_a_evento,\n    f.temperatura_media_mad, f.temperatura_media_bcn,\n    d.anio, d.trimestre, d.mes, d.nombre_mes,\
  \ d.dia_semana, d.nombre_dia,\n    d.dia_semana || ' · ' || d.nombre_dia AS dia_semana_etiqueta,\n    d.es_fin_semana, d.festivo_nombre, d.festivo_ambito,\n    t.trenes,\n    d.anio || '-T' || d.trimestre\
  \                           AS trimestre_etiqueta\nFROM read_parquet('s3://raillytics-gold/fact_ocupacion_diaria/*.parquet') AS f\nLEFT JOIN read_parquet('s3://raillytics-gold/dim_fecha/*.parquet')  \
  \      AS d USING (fecha_id)\nLEFT JOIN (\n    SELECT fecha_id, sum(trenes) AS trenes\n    FROM read_parquet('s3://raillytics-gold/fact_oferta_diaria/*.parquet')\n    WHERE corredor = 'Madrid-Barcelona'\n\
  \    GROUP BY fecha_id\n) AS t USING (fecha_id)"
