  warning_text: null
- metric_name: ocupacion_imposible
  verbose_name: Ocupación imposible (más del 100 %)
  metric_type: null
  expression: AVG(CASE WHEN NOT plausible THEN ocupacion END)
  description: 'Los días cuya ocupación calculada pasa del 100 %. No es que se llenen: es que la demanda de la CNMC incluye a Iryo y la oferta del NAP no.'
  d3format: .1%
  extra: null
  warning_text: null
