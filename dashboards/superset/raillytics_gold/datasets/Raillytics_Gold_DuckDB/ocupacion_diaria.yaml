table_name: ocupacion_diaria
main_dttm_col: fecha
description: 'Coeficiente de ocupación diaria del corredor AVE Madrid–Barcelona: viajeros·km / plazas·km. MITAD REAL — el total del trimestre es de la CNMC, pero el reparto entre los días lo hacen las reglas
  del proyecto, así que la ocupación de un día concreto NO es una medición. No es «viajeros por plaza»: un asiento se vende por tramos, así que el ratio de cabezas pasa del 100 % legítimamente; medido en
  km, el 100 % sí es un techo real. «Plausible» marca los días que no lo pasan, y 21 de los 25 imposibles son fin de semana porque el NAP da trenes y no plazas y las composiciones dobles no se ven: cualquier
  media debería filtrar por plausible o decir que no lo hace.'
default_endpoint: null
offset: 0
