table_name: precio_recomendado
main_dttm_col: fecha
description: 'Precio recomendado por día, franja y operador. El precio base y el rango al que se acota la recomendación son
  DATO MEDIDO de la CNMC; la elasticidad es una HIPÓTESIS declarada en config/reglas_demanda.yml, donde está el intento de
  estimarla (−0,299 con error estándar 0,453: ruido) y por qué no se puede con estas fuentes. Con la referencia medida la
  regla es neutra en promedio: lo que señala es qué días y franjas van por encima o por debajo de la media, no que el nivel
  de precios del corredor esté mal. El ratio de aceptación del plan NO está aquí porque mide un proceso humano —qué recomendaciones
  adopta un revenue manager— que el proyecto no tiene; lo que sí queda montado es el mecanismo que lo haría calculable.'
default_endpoint: null
offset: 0
cache_timeout: null
schema: null
catalog: null
sql: "-- Precio recomendado por dia, franja horaria y operador del corredor.\n--\n-- QUE ES DATO Y QUE ES HIPOTESIS, porque\
  \ esta tabla mezcla las dos:\n--   precio base         MEDIDO: `precio_medio_eur` de la CNMC, por trayecto, trimestre y\
  \ operador\n--   rango min/max       MEDIDO: el recorrido de precios observado de ese operador en el corredor\n--   ocupacion\
  \ prevista  derivada, y con la hipotesis `base_franja` dentro\n--   elasticidad         HIPOTESIS declarada en config/reglas_demanda.yml\n\
  --\n-- La regla:  precio_base x (ocupacion / referencia) ** (1/|elasticidad|),  acotado al rango observado.\n--\n-- Por\
  \ que la elasticidad es hipotesis: se intento estimarla con un panel de 45 trimestres-operador de\n-- la CNMC y salio -0,299\
  \ con error estandar 0,453 (t = -0,66), o sea ruido. Hay dos razones de fondo:\n-- el operador sube el precio cuando preve\
  \ demanda alta (endogeneidad), y el corredor esta topado por\n-- capacidad —el precio sube un 72 % entre 2023-T1 y 2025-T4\
  \ y los viajeros se quedan en 3,3-3,9 M por\n-- trimestre—, asi que la serie no mide cuanta demanda hay sino cuantas plazas\
  \ se vendieron.\n--\n-- QUE DICE Y QUE NO DICE: con la referencia medida la regla es NEUTRA en promedio, asi que lo que\n\
  -- senala es que dias y que franjas van por encima o por debajo de la media del corredor. No afirma\n-- que el nivel de\
  \ precios este mal, ni predice lo que el operador va a hacer.\n--\n-- `version_regla` firma los parametros con los que se\
  \ calculo cada fila. Es lo que haria atribuible\n-- un ratio de aceptacion el dia que hubiera un revenue manager que aceptara\
  \ o rechazara.\nSELECT\n    fecha,\n    franja,\n    es_punta,\n    CASE WHEN es_punta THEN 'punta' ELSE 'valle' END   \
  \     AS tipo_franja,\n    operador_id,\n    empresa                                                 AS operador,\n    anio,\n\
  \    trimestre,\n    precio_base_eur,\n    precio_min_eur,\n    precio_max_eur,\n    ocupacion,\n    ocupacion_referencia,\n\
  \    elasticidad,\n    factor,\n    precio_sin_acotar_eur,\n    precio_recomendado_eur,\n    variacion,\n    recortado,\n\
  \    en_rango_observado,\n    plausible,\n    version_regla\nFROM read_parquet('s3://raillytics-gold/fact_precio_recomendado/*.parquet')"
