metrics:
- metric_name: precio_recomendado_medio
  verbose_name: Precio recomendado
  metric_type: null
  expression: AVG(CASE WHEN plausible THEN precio_recomendado_eur END)
  description: Media de las recomendaciones de los días plausibles.
  d3format: $,.2f
  extra: null
  warning_text: null
- metric_name: precio_base_medio
  verbose_name: Precio real de la CNMC
  metric_type: null
  expression: AVG(CASE WHEN plausible THEN precio_base_eur END)
  description: El precio medio observado, que es la base sobre la que se recomienda.
  d3format: $,.2f
  extra: null
  warning_text: null
- metric_name: precio_punta
  verbose_name: Precio recomendado en punta
  metric_type: null
  expression: AVG(CASE WHEN es_punta AND plausible THEN precio_recomendado_eur END)
  description: Mañana (6-9) y tarde (15-19).
  d3format: $,.2f
  extra: null
  warning_text: null
- metric_name: precio_valle
  verbose_name: Precio recomendado en valle
  metric_type: null
  expression: AVG(CASE WHEN NOT es_punta AND plausible THEN precio_recomendado_eur END)
  description: null
  d3format: $,.2f
  extra: null
  warning_text: null
- metric_name: en_rango
  verbose_name: Recomendaciones en el rango observado
  metric_type: null
  expression: AVG(CASE WHEN plausible THEN CAST(en_rango_observado AS INT) END)
  description: 'Parte de las recomendaciones que caen dentro del recorrido de precios que ese operador ha puesto de verdad
    en el corredor. Es lo medible que ocupa el hueco del ratio de aceptación: contrasta el modelo contra dato real en vez
    de contra una decisión humana que no existe.'
  d3format: .1%
  extra: null
  warning_text: null
- metric_name: desvio_medio
  verbose_name: Desvío sobre el precio real
  metric_type: null
  expression: AVG(CASE WHEN plausible THEN abs(variacion) END)
  description: Cuánto mueve la regla el precio, en valor absoluto.
  d3format: .1%
  extra: null
  warning_text: null
- metric_name: recomendaciones
  verbose_name: Recomendaciones registradas
  metric_type: null
  expression: COUNT(*)
  description: Cada una guardada con sus entradas y la versión de la regla. Es el mecanismo sobre el que se calcularía el
    ratio de aceptación si hubiera operador.
  d3format: ',d'
  extra: null
  warning_text: null
