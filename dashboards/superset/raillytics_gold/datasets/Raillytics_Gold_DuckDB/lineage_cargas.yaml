      ('staging:cnmc_viajeros_producto', 'l1:cnmc_viajeros_producto', 'bronze_l1_raw_uploader', 'Copia el fichero tal cual a MinIO (Spark Streaming · RawUploader)', ''),
      ('staging:crtm', 'l1:crtm', 'bronze_l1_raw_uploader', 'Copia el fichero tal cual a MinIO (Spark Streaming · RawUploader)', ''),
      ('staging:ine_turismo_madrid_barcelona', 'l1:ine_turismo_madrid_barcelona', 'bronze_l1_raw_uploader', 'Copia el fichero tal cual a MinIO (Spark Streaming · RawUploader)', ''),
      ('staging:nap_gtfs_ouigo', 'l1:nap_gtfs_ouigo', 'bronze_l1_raw_uploader', 'Copia el fichero tal cual a MinIO (Spark Streaming · RawUploader)', ''),
      ('staging:nap_gtfs_renfe', 'l1:nap_gtfs_renfe', 'bronze_l1_raw_uploader', 'Copia el fichero tal cual a MinIO (Spark Streaming · RawUploader)', ''),
      ('staging:renfe_trip_updates', 'l1:renfe_trip_updates', 'bronze_l1_raw_uploader', 'Copia el fichero tal cual a MinIO (Spark Streaming · RawUploader)', ''),
      ('staging:renfe_vehicle_positions', 'l1:renfe_vehicle_positions', 'bronze_l1_raw_uploader', 'Copia el fichero tal cual a MinIO (Spark Streaming · RawUploader)', '')),
  carga AS (
      SELECT CASE proceso
      WHEN 'bronze_download' THEN 'staging:' || tabla
      WHEN 'bronze_l1_raw_uploader' THEN 'l1:' || tabla
      WHEN 'bronze_l2_parquet_converter' THEN 'l2:' || split_part(tabla, '/', 1)
      WHEN 'silver_builder' THEN 'silver:' || tabla
      WHEN 'silver_sample' THEN 'silver:' || tabla
      WHEN 'gold_build' THEN 'gold:' || tabla
      WHEN 'prediccion_muestra' THEN 'l2:muestra_' || tabla
      WHEN 'prediccion_demanda' THEN CASE WHEN tabla = 'fact_prediccion_demanda' THEN 'gold:' ELSE 'pred:' END || tabla
      WHEN 'referencia_festivos' THEN 'silver:' || tabla
      WHEN 'referencia_meteo' THEN 'silver:' || tabla
      WHEN 'referencia_turismo_mensual' THEN 'silver:' || tabla
      WHEN 'referencia_oferta_diaria' THEN 'silver:' || tabla
      WHEN 'referencia_oferta_franja' THEN 'silver:' || tabla
      WHEN 'referencia_ml_ocupacion_diaria' THEN 'silver:' || tabla
      WHEN 'ml_metricas' THEN 'gold:' || tabla
      WHEN 'ml_ocupacion_franja' THEN 'gold:' || tabla
      WHEN 'precio_recomendado' THEN 'gold:' || tabla
      WHEN 'calidad_completitud_silver' THEN 'gold:' || tabla
      WHEN 'calidad_cobertura_ingesta' THEN 'gold:' || tabla
    END AS nodo, run_id, proceso, estado, filas, duracion_s, error, parametros,
             timezone('Europe/Madrid', timezone('UTC', inicio)) AS inicio
      FROM read_parquet('s3://raillytics-gold/_trazabilidad/cargas/*.parquet', union_by_name = true)
  ),
  -- Una fila por (nodo, ejecución): un ZIP de L2 registra un fichero por fila y se suman sus filas.
  por_run AS (
      SELECT nodo, run_id, any_value(proceso) AS proceso, min(inicio) AS inicio, sum(filas) AS filas, sum(duracion_s) AS duracion_s,
             CASE WHEN bool_or(estado = 'error') THEN 'error' ELSE 'ok' END AS estado,
             string_agg(DISTINCT error, ' | ') AS error, any_value(parametros) AS parametros
      FROM carga WHERE nodo IS NOT NULL GROUP BY nodo, run_id
  ),
  ultimo AS (SELECT * FROM por_run QUALIFY row_number() OVER (PARTITION BY nodo ORDER BY inicio DESC) = 1),
  ultimo_proceso AS (SELECT * FROM por_run QUALIFY row_number() OVER (PARTITION BY nodo, proceso ORDER BY inicio DESC) = 1),
  historico AS (
      SELECT nodo, count(*) AS n_cargas, sum(CASE WHEN estado = 'error' THEN 1 ELSE 0 END) AS n_errores FROM por_run GROUP BY nodo
  )
  SELECT
      r.run_id, r.proceso, a.origen, a.destino, o.capa AS categoria_origen, d.capa AS categoria_destino, a.transformacion,
      r.estado, r.filas, r.inicio, r.duracion_s, r.error,
      CASE WHEN regexp_full_match(json_extract_string(r.parametros, '$.airflow.run_id'), '[A-Za-z0-9_.:+-]+') AND regexp_full_match(json_extract_string(r.parametros, '$.airflow.dag_id'), '[A-Za-z0-9_.-]+') AND regexp_full_match(json_extract_string(r.parametros, '$.airflow.task_id'), '[A-Za-z0-9_.-]+') THEN '<a href="http://localhost:8080/dags/' || json_extract_string(r.parametros, '$.airflow.dag_id') || '/runs/' || replace(replace(json_extract_string(r.parametros, '$.airflow.run_id'), '+', '%2B'), ':', '%3A') || '/tasks/' || json_extract_string(r.parametros, '$.airflow.task_id') || CASE WHEN try_cast(json_extract_string(r.parametros, '$.airflow.map_index') AS INTEGER) >= 0 THEN '/mapped/' || CAST(try_cast(json_extract_string(r.parametros, '$.airflow.map_index') AS INTEGER) AS VARCHAR) ELSE '' END || '" target="_blank" rel="noopener noreferrer">log de Airflow</a>' END AS enlace_log,
      round(1 + ln(1 + coalesce(r.filas, 0)), 3) AS peso
  FROM por_run r
  JOIN aristas a ON a.destino = r.nodo AND a.proceso = r.proceso
  JOIN nodos o ON o.nodo = a.origen
  JOIN nodos d ON d.nodo = a.destino
  ORDER BY r.inicio DESC, a.destino, a.origen
