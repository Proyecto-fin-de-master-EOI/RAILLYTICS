table_name: puntualidad_servicios
main_dttm_col: fecha
description: Un servicio (tren) por fila con su retraso en llegada (Fact_Puntualidad ⋈ dimensiones), leído con DuckDB del
  Parquet de s3://raillytics-gold.
default_endpoint: null
offset: 0
cache_timeout: null
schema: null
catalog: null
sql: |-
  -- Fact_Puntualidad con sus dimensiones (modelo en estrella de la capa Gold).
  SELECT
      p.fecha,
      p.hora_prevista,
      p.hora_real,
      p.hora,
      printf('%02d:00', p.hora) AS franja_horaria,
      p.servicio_id,
      d.anio,
      d.mes,
      d.nombre_mes,
      d.dia_semana,
      d.nombre_dia,
      d.dia_semana || '. ' || d.nombre_dia AS dia_semana_etiqueta,
      d.es_fin_de_semana,
      d.es_festivo,
      CASE
          WHEN d.es_festivo THEN 'festivo'
          WHEN d.es_fin_de_semana THEN 'fin de semana'
          ELSE 'laborable'
      END AS tipo_dia,
      e.nombre AS estacion,
      e.provincia,
      e.comunidad,
      l.nombre AS linea,
      l.tipo_tren,
      p.retraso_min,
      p.estado,
      p.es_puntual,
      p.cancelado,
      p.condicion_meteo,
      p.temperatura_media,
      p.precipitacion_mm
  FROM read_parquet('s3://raillytics-gold/fact_puntualidad/*.parquet') AS p
  JOIN read_parquet('s3://raillytics-gold/dim_fecha/*.parquet') AS d USING (fecha_id)
  LEFT JOIN read_parquet('s3://raillytics-gold/dim_estacion/*.parquet') AS e USING (estacion_id)
  JOIN read_parquet('s3://raillytics-gold/dim_linea/*.parquet') AS l USING (linea_id)
