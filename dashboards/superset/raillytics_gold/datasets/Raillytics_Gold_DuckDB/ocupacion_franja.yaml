table_name: ocupacion_franja
main_dttm_col: fecha
description: 'Ocupación por franja horaria. Los TRENES por franja son dato medido —la hora de salida del GTFS del NAP— pero
  el reparto de la demanda entre franjas es una HIPÓTESIS declarada en config/reglas_demanda.yml: dentro del día el operador
  elige libremente el horario, así que la oferta sigue a la demanda y no queda señal con la que medir el diferencial de ocupación.
  Los KPI de hora punta y hora valle heredan esa condición. El perfil de oferta sí es real y tiene un dato interesante: Renfe
  concentra en las puntas y OUIGO reparte casi plano.'
default_endpoint: null
offset: 0
cache_timeout: null
schema: null
catalog: null
sql: "-- Demanda y ocupacion por franja horaria del corredor.\n--\n-- QUE ES DATO Y QUE ES HIPOTESIS, porque esta tabla mezcla\
  \ las dos y no distinguirlo seria enganoso:\n--   trenes por franja   MEDIDO: hora de salida del origen en stop_times.txt\
  \ del GTFS del NAP\n--   demanda del dia     derivada: reparto de la DTC desde el total trimestral de la CNMC\n--   reparto\
  \ por franja  HIPOTESIS: `base_franja` de config/reglas_demanda.yml\n--\n-- Por que el reparto es hipotesis y no medida:\
  \ dentro del dia el operador elige libremente a que hora\n-- pone cada tren, asi que la oferta sigue a la demanda de cerca\
  \ y no queda senal con la que estimar\n-- el diferencial de ocupacion entre franjas. El modelo que si funciono para el dia\
  \ de la semana\n-- (demanda = oferta atenuada) daria aqui la MADRUGADA como la franja mas llena, que es absurdo.\n--\n--\
  \ `plausible` marca las filas que no pasan del 100 %. Arrastra el aviso de siempre: el NAP da trenes\n-- y no plazas, asi\
  \ que las composiciones dobles no se ven.\nSELECT\n    fecha,\n    franja,\n    es_punta,\n    CASE WHEN es_punta THEN 'punta'\
  \ ELSE 'valle' END        AS tipo_franja,\n    trenes,\n    cuota_oferta,\n    cuota_demanda,\n    ocupacion,\n    plazas_vacias,\n\
  \    plausible\nFROM read_parquet('s3://raillytics-gold/fact_ocupacion_franja/*.parquet')"
