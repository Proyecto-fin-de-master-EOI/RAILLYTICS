table_name: precio_medio_mensual
main_dttm_col: fecha_inicio
description: 'Precio medio mensual por trayecto del corredor AVE Madrid–Barcelona por operador. Datos REALES de la CNMC (no sintéticos),
  solo el corredor AVE Madrid–Barcelona. En la demanda Avlo va dentro de Renfe (la CNMC no la separa); en los precios aparece por separado
  hasta 2025-T4. «Viajeros por plaza ofertada» no es ocupación: un asiento sirve a varios tramos.'
default_endpoint: null
offset: 0
cache_timeout: null
schema: null
catalog: null
sql: |-
  -- Fact_Precio_Mensual ⋈ Dim_Operador, leído con DuckDB del Parquet de Gold en MinIO (datos reales de la CNMC).
  -- Aquí RENFE es Renfe-AVE y AVLO es Renfe-AVLO. precio_medio_eur en euros sin IVA.
  SELECT p.fecha_inicio, p.anio, p.mes, p.operador_id,
         CASE p.operador_id WHEN 'RENFE' THEN 'Renfe (AVE)' WHEN 'AVLO' THEN 'Avlo' WHEN 'TOTAL' THEN 'Total corredor' ELSE coalesce(o.nombre, p.operador_id) END AS operador,
         p.operador_id = 'TOTAL' AS es_total,
         p.precio_medio_eur,
         p.fecha_inicio = MAX(p.fecha_inicio) OVER () AS es_ultimo_mes
  FROM read_parquet('s3://raillytics-gold/fact_precio_mensual/*.parquet') AS p
  LEFT JOIN read_parquet('s3://raillytics-gold/dim_operador/*.parquet') AS o USING (operador_id)
