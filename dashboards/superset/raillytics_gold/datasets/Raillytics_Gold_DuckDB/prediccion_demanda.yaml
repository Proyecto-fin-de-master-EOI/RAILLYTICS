table_name: prediccion_demanda
main_dttm_col: fecha
description: 'Predicción diaria de demanda del corredor AVE Madrid–Barcelona (raillytics.prediccion): una fila por día y ejecución,
  leída de s3://raillytics-gold/fact_prediccion_demanda/.'
default_endpoint: null
offset: 0
cache_timeout: null
schema: null
catalog: null
sql: |-
  -- Predicción diaria de demanda del corredor AVE Madrid–Barcelona (raillytics.prediccion): una fila por día y ejecución.
  -- La publica cada ejecución de `make 07_prediccion` en s3://raillytics-gold/fact_prediccion_demanda/<run_id>.parquet.
  -- generado_en se guarda en UTC; aquí se muestra en hora de Madrid. es_ultima marca la ejecución más reciente de cada trimestre.
  -- vispera, puente, regreso, junto_a_evento y exceso solo existen en las ejecuciones publicadas desde que se añadieron: la
  -- SELECT vacía del UNION ALL BY NAME declara esas columnas para que la consulta funcione aunque todos los Parquet sean anteriores.
  WITH base AS (
      SELECT
          run_id,
          timezone('Europe/Madrid', timezone('UTC', generado_en)) AS generado_en,
          trimestre, corredor, modelo, version_prompt,
          datos_sinteticos, total_esperado, fecha, dia_semana, festivo, eventos,
          viajeros_previstos, indice, motivo,
          vispera, puente, regreso, junto_a_evento, exceso
      FROM (
          SELECT * FROM read_parquet('s3://raillytics-gold/fact_prediccion_demanda/*.parquet', union_by_name = true)
          UNION ALL BY NAME
          SELECT NULL::BOOLEAN AS vispera, NULL::BOOLEAN AS puente, NULL::BOOLEAN AS regreso,
                 NULL::BOOLEAN AS junto_a_evento, NULL::DOUBLE AS exceso
          WHERE false
      )
  )
  SELECT
      run_id,
      version_prompt || ' · ' || modelo || ' · ' || strftime(generado_en, '%d/%m %H:%M') AS ejecucion,
      generado_en,
      trimestre,
      corredor,
      modelo,
      version_prompt,
      CASE WHEN datos_sinteticos THEN 'Sintéticos' ELSE 'Reales' END AS datos,
      generado_en = MAX(generado_en) OVER (PARTITION BY trimestre) AS es_ultima,
      total_esperado,
      fecha,
      dia_semana,
      CAST(isodow(fecha) AS VARCHAR) || ' · ' || dia_semana AS dia_semana_etiqueta,
      festivo,
      eventos,
      CASE WHEN festivo IS NOT NULL THEN 'Festivo'
           WHEN eventos IS NOT NULL THEN 'Evento'
           WHEN isodow(fecha) >= 6 THEN 'Fin de semana'
           ELSE 'Laborable' END AS tipo_dia,
      viajeros_previstos,
      indice,
      motivo,
      vispera,
      puente,
      regreso,
      junto_a_evento,
      exceso
  FROM base
