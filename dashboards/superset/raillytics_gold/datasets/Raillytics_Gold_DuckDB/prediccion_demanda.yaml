sql: "-- Predicción diaria de demanda del corredor AVE Madrid–Barcelona (raillytics.prediccion): una fila por día y ejecución.\n\
  -- La publica cada ejecución de `make 07_prediccion` en s3://raillytics-gold/fact_prediccion_demanda/<run_id>.parquet.\n\
  -- generado_en se guarda en UTC; aquí se muestra en hora de Madrid. es_ultima marca la ejecución más reciente de cada trimestre.\n\
  -- vispera, puente, regreso, junto_a_evento y exceso solo existen en las ejecuciones publicadas desde que se añadieron:\
  \ la\n-- SELECT vacía del UNION ALL BY NAME declara esas columnas para que la consulta funcione aunque todos los Parquet\
  \ sean anteriores.\nWITH base AS (\n    SELECT\n        run_id,\n        timezone('Europe/Madrid', timezone('UTC', generado_en))\
  \ AS generado_en,\n        trimestre, corredor, modelo, version,\n        datos_sinteticos, total_esperado, fecha,\
  \ dia_semana, festivo, eventos,\n        viajeros_previstos, indice, motivo,\n        vispera, puente, regreso, junto_a_evento,\
  \ exceso,\n        cota_inferior, cota_superior, ic_confianza, ic_cobertura\n    FROM (\n        SELECT * FROM read_parquet('s3://raillytics-gold/fact_prediccion_demanda/*.parquet',\
  \ union_by_name = true)\n        UNION ALL BY NAME\n        SELECT NULL::BOOLEAN AS vispera, NULL::BOOLEAN AS puente, NULL::BOOLEAN\
  \ AS regreso,\n               NULL::BOOLEAN AS junto_a_evento, NULL::DOUBLE AS exceso,\n               -- La banda de confianza\
  \ llego despues: las ejecuciones anteriores no la traen.\n               NULL::DOUBLE AS cota_inferior, NULL::DOUBLE AS cota_superior,\n\
  \               NULL::DOUBLE AS ic_confianza, NULL::DOUBLE AS ic_cobertura\n        WHERE false\n    )\n)\nSELECT\n    run_id,\n\
  \    version || ' · ' || modelo || ' · ' || strftime(generado_en, '%d/%m %H:%M') AS ejecucion,\n    generado_en,\n\
  \    trimestre,\n    corredor,\n    modelo,\n    version,\n    CASE WHEN datos_sinteticos THEN 'Sintéticos' ELSE\
  \ 'Reales' END AS datos,\n    generado_en = MAX(generado_en) OVER (PARTITION BY trimestre) AS es_ultima,\n    total_esperado,\n\
  \    fecha,\n    dia_semana,\n    CAST(isodow(fecha) AS VARCHAR) || ' · ' || dia_semana AS dia_semana_etiqueta,\n    festivo,\n\
  \    eventos,\n    CASE WHEN festivo IS NOT NULL THEN 'Festivo'\n         WHEN eventos IS NOT NULL THEN 'Evento'\n     \
  \    WHEN isodow(fecha) >= 6 THEN 'Fin de semana'\n         ELSE 'Laborable' END AS tipo_dia,\n    viajeros_previstos,\n\
  \    indice,\n    motivo,\n    vispera,\n    puente,\n    regreso,\n    junto_a_evento,\n    exceso,\n    cota_inferior,\n\
  \    cota_superior,\n    ic_confianza,\n    ic_cobertura,\n    -- Amplitud de la banda en proporcion al valor central: lo\
  \ que se lee de un vistazo.\n    CASE WHEN viajeros_previstos > 0 AND cota_superior IS NOT NULL\n         THEN (cota_superior\
  \ - cota_inferior) * 1.0 / viajeros_previstos END AS ic_amplitud\nFROM base"
