table_name: backtest_nivel
main_dttm_col: fecha_inicio
description: 'Backtest de la regla de nivel de la predicción con los trimestres reales de la CNMC. Datos REALES de la CNMC (no sintéticos),
  solo el corredor AVE Madrid–Barcelona. En la demanda Avlo va dentro de Renfe (la CNMC no la separa); en los precios aparece por separado
  hasta 2025-T4. «Viajeros por plaza ofertada» no es ocupación: un asiento sirve a varios tramos.'
default_endpoint: null
offset: 0
cache_timeout: null
schema: null
catalog: null
sql: |-
  -- previsto(T) = real(T-4) × real(T-2) / real(T-6): la regla de raillytics.prediccion.nivel con la CNMC publicando con dos trimestres de retraso.
  WITH t AS (
      SELECT fecha_inicio, anio, trimestre, SUM(viajeros) AS real_total
      FROM read_parquet('s3://raillytics-gold/fact_mercado_trimestral/*.parquet') WHERE operador_id <> 'TOTAL' GROUP BY fecha_inicio, anio, trimestre
  ),
  b AS (
      SELECT *, LAG(real_total, 2) OVER w AS ultimo_publicado, LAG(real_total, 4) OVER w AS mismo_trimestre_anterior,
             LAG(real_total, 6) OVER w AS ultimo_publicado_anterior
      FROM t WINDOW w AS (ORDER BY fecha_inicio)
  ),
  p AS (
      SELECT fecha_inicio, anio || '-T' || trimestre AS trimestre_etiqueta, real_total,
             CAST(round(mismo_trimestre_anterior * 1.0 * ultimo_publicado / ultimo_publicado_anterior) AS BIGINT) AS previsto_total
      FROM b WHERE mismo_trimestre_anterior IS NOT NULL AND ultimo_publicado IS NOT NULL AND ultimo_publicado_anterior IS NOT NULL
  )
  SELECT fecha_inicio, trimestre_etiqueta, real_total, previsto_total,
         ABS(previsto_total - real_total) * 1.0 / real_total AS error_absoluto,
         (previsto_total - real_total) * 1.0 / real_total AS error_relativo,
         ROW_NUMBER() OVER (ORDER BY fecha_inicio DESC) <= 8 AS ultimos_8
  FROM p
