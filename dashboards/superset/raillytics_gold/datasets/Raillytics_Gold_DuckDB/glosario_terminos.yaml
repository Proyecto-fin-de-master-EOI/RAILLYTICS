      ('Capa Silver', 'Plataforma Data Lakehouse', 'Técnico', 'Tablas limpias, tipadas, sin duplicados y enriquecidas gestionadas en Delta Lake mediante Spark Streaming o transformaciones SQL reproducibles.', '-', 'Silver, Curated Zone', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ silver_cnmc_trimestral</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ silver_viajeros_enriquecidos</span>', '<a href="/superset/dashboard/lineage-cargas/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 lineage-cargas</a>, <a href="/superset/dashboard/trazabilidad-cargas/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 trazabilidad-cargas</a>, <a href="/superset/dashboard/catalogo-datos-glosario/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 catalogo-datos-glosario</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ claves_sin_nulos</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ grano_unico</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ filas_minimas</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Arquitectura Medallion</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Capa Gold</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Quality Gate (Control de Calidad)</span>'),
      ('Cobertura completa del snapshot', 'Plataforma Data Lakehouse', 'Técnico', 'Marca de si la descarga del NAP de ese día cubre la jornada entera. Un snapshot parcial da menos trenes de los que de verdad circularon, así que esos días se excluyen de las medias de oferta: por eso la tabla de trenes por día de la semana dice 59 jueves y no los 72 que tienen dato. La columna «días» está precisamente para que se vea sobre cuántos se calcula la media.', '-', 'Snapshot completo', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_oferta_diaria</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ oferta_diaria</span>', '<a href="/superset/dashboard/panel-direccion/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 panel-direccion</a>, <a href="/superset/dashboard/demanda-ferroviaria/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 demanda-ferroviaria</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ cuadra_con_silver</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Frescura de Datos (Freshness)</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Ocupación imposible (no plausible)</span>'),
      ('DuckDB', 'Plataforma Data Lakehouse', 'Técnico', 'Motor SQL columnar OLAP embebido en Superset que permite consultar con alto rendimiento ficheros Parquet almacenados en MinIO/S3 sin necesidad de levantar un almacén de datos externo pesado.', '-', 'Motor SQL analítico', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ datasets/Raillytics_Gold_DuckDB</span>', '<a href="/superset/dashboard/catalogo-datos-glosario/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 catalogo-datos-glosario</a>, <a href="/superset/dashboard/mercado-corredor/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 mercado-corredor</a>, <a href="/superset/dashboard/demanda-ferroviaria/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 demanda-ferroviaria</a>, <a href="/superset/dashboard/puntualidad/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 puntualidad</a>, <a href="/superset/dashboard/trazabilidad-cargas/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 trazabilidad-cargas</a>, <a href="/superset/dashboard/lineage-cargas/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 lineage-cargas</a>', '-', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Capa Gold</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Lineage de Cargas (Linaje)</span>'),
      ('Frescura de Datos (Freshness)', 'Plataforma Data Lakehouse', 'Técnico', 'Tiempo transcurrido desde la marca temporal de la última carga exitosa de una tabla hasta el instante presente, empleado para monitorizar retrasos de ingesta.', 'date_diff(''hour'', max(fin_carga), current_timestamp)', 'Freshness, Latencia de datos', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ frescura_tablas</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ _trazabilidad/cargas</span>', '<a href="/superset/dashboard/trazabilidad-cargas/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 trazabilidad-cargas</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ serie_actualizada</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ freshness_maxima</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Trazabilidad de Cargas</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Run ID</span>'),
      ('Grano de Datos (Granularidad)', 'Plataforma Data Lakehouse', 'Técnico', 'El nivel exacto de detalle y significado individual que representa cada fila contenida en una tabla o dataset.', '-', 'Granularidad, Grain', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ data_catalog</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ config/data_catalog.yml</span>', '<a href="/superset/dashboard/catalogo-datos-glosario/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 catalogo-datos-glosario</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ grano_unico</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Capa Gold</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Capa Silver</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Quality Gate (Control de Calidad)</span>'),
      ('Latencia de la carga completa', 'Plataforma Data Lakehouse', 'Técnico', 'Cuánto tarda la cadena entera de principio a fin, medida con el reloj de pared del orquestador que la lanza. Incluye las esperas a que los trabajos de streaming se asienten, que ninguna fase registra por separado. No se mide sumando fases «del día»: si una fase corre dos veces —el DAG programado de madrugada y la cadena lanzada a mano por la mañana— se contarían las horas de nada que hay en medio.', 'fin − inicio de la ejecución de carga_e2e que empieza por infra', 'Latencia extremo a extremo, Tiempo de la carga', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ cargas</span>', '<a href="/superset/dashboard/panel-direccion/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 panel-direccion</a>, <a href="/superset/dashboard/trazabilidad-cargas/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 trazabilidad-cargas</a>', '-', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Trazabilidad de Cargas</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Run ID</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Frescura de Datos (Freshness)</span>'),
      ('Lineage de Cargas (Linaje)', 'Plataforma Data Lakehouse', 'Técnico', 'Grafo de dependencias que conecta cada fuente de datos con sus tablas intermedias, modelos, datasets y dashboards, cruzado con el estado observado de las cargas.', '-', 'Data Lineage, Linaje de datos', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ lineage_nodos</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ lineage_aristas</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ lineage_cargas</span>', '<a href="/superset/dashboard/lineage-cargas/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 lineage-cargas</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ grafo_conectado</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ aristas_validas</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Trazabilidad de Cargas</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Arquitectura Medallion</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Quality Gate (Control de Calidad)</span>'),
      ('Quality Gate (Control de Calidad)', 'Plataforma Data Lakehouse', 'Técnico', 'Validación automatizada de reglas de integridad (filas mínimas, no nulos, unicidad de grano, rango de valores, coherencia relacional) aplicada a una tabla durante su procesamiento.', '-', 'Gate, Data Quality Check', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ config/quality_gates.yml</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ _trazabilidad/calidad</span>', '<a href="/superset/dashboard/trazabilidad-cargas/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 trazabilidad-cargas</a>, <a href="/superset/dashboard/lineage-cargas/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 lineage-cargas</a>, <a href="/superset/dashboard/catalogo-datos-glosario/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 catalogo-datos-glosario</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ filas_minimas</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ claves_sin_nulos</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ grano_unico</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Quality Gate Bloqueante</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Quality Gate Aviso</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Capa Silver</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Capa Gold</span>'),
      ('Quality Gate Aviso', 'Plataforma Data Lakehouse', 'Técnico', 'Regla de calidad preventiva que registra una alerta en la trazabilidad (''aviso'') sin abortar la ejecución ni bloquear la escritura de la tabla.', '-', 'Warning gate', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ config/quality_gates.yml</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ _trazabilidad/calidad</span>', '<a href="/superset/dashboard/trazabilidad-cargas/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 trazabilidad-cargas</a>, <a href="/superset/dashboard/lineage-cargas/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 lineage-cargas</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ atributos_estacion_sin_nulos</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ atributos_linea_sin_nulos</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ festivo_con_nombre</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Quality Gate (Control de Calidad)</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Quality Gate Bloqueante</span>'),
      ('Quality Gate Bloqueante', 'Plataforma Data Lakehouse', 'Técnico', 'Regla de calidad crítica cuya no superación detiene inmediatamente la promoción de datos a la capa destino y envía los registros a cuarentena con estado ''error''.', '-', 'Gate crítico, Fail-closed', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ config/quality_gates.yml</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ _trazabilidad/calidad</span>', '<a href="/superset/dashboard/trazabilidad-cargas/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 trazabilidad-cargas</a>, <a href="/superset/dashboard/lineage-cargas/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 lineage-cargas</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ claves_sin_nulos</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ grano_unico</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ viajeros_no_negativos</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Quality Gate (Control de Calidad)</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Quality Gate Aviso</span>'),
      ('Run ID', 'Plataforma Data Lakehouse', 'Técnico', 'Identificador unívoco temporal de ejecución (formato: AAAAMMDDTHHMMSS-proceso-hex) que vincula todas las tablas, logs de Airflow y quality gates generados en una misma corrida.', '-', 'ID de ejecución, Execution Run', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ _trazabilidad/cargas</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ _trazabilidad/calidad</span>', '<a href="/superset/dashboard/trazabilidad-cargas/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 trazabilidad-cargas</a>, <a href="/superset/dashboard/lineage-cargas/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 lineage-cargas</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ run_id_unico</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Trazabilidad de Cargas</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Frescura de Datos (Freshness)</span>'),
      ('Trazabilidad de Cargas', 'Plataforma Data Lakehouse', 'Técnico', 'Registro histórico persistente en Parquet (_trazabilidad/cargas/) de cada ejecución del pipeline: run_id, proceso, capa, tabla, origen, destino, filas, bytes, duración, estado y ejecutor.', '-', 'Auditoría de cargas, Load Traceability', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ _trazabilidad/cargas</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ cargas</span>', '<a href="/superset/dashboard/trazabilidad-cargas/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 trazabilidad-cargas</a>, <a href="/superset/dashboard/lineage-cargas/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 lineage-cargas</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ carga_registrada</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ anomalia_volumen</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ anomalia_duracion</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Run ID</span>, <span style="display:inline-block;background:#e6fffa;color:#