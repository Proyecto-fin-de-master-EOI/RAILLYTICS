table_name: glosario_terminos
main_dttm_col: null
description: Glosario oficial de conceptos de negocio ferroviario y arquitectura técnica de la plataforma.
default_endpoint: null
offset: 0
cache_timeout: null
schema: null
catalog: null
sql: |-
  -- Glosario de Términos de Raillytics: conceptos oficiales declarados en config/glosario.yml
  -- Se genera con `make catalog` (raillytics.catalog): no lo edites a mano.
  WITH glosario(termino, dominio, tipo, definicion, formula, sinonimos, tablas_relacionadas, dashboards_relacionados, quality_gates, terminos_relacionados) AS (VALUES
      ('Corredor Ferroviario', 'Negocio Ferroviario', 'Negocio', 'Eje o infraestructura troncal que conecta grandes nodos urbanos o regiones geográficas (p. ej. Madrid–Barcelona, Madrid–Levante, Madrid–Andalucía). En Raillytics el análisis central se focaliza en el corredor de alta velocidad AVE-MAD-BCN.', '-', 'Corredor, Eje troncal', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_mercado_trimestral</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_viajeros</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ dim_linea</span>', '<a href="/superset/dashboard/mercado-corredor/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 mercado-corredor</a>, <a href="/superset/dashboard/demanda-ferroviaria/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 demanda-ferroviaria</a>, <a href="/superset/dashboard/prediccion-demanda/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 prediccion-demanda</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ corredor_madrid_barcelona_presente</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ lineas_en_viajeros</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Viajeros (Pax)</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Cuota de Mercado (Market Share)</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Servicios Comerciales Liberalizados</span>'),
      ('Cuota de Mercado (Market Share)', 'Negocio Ferroviario', 'Negocio', 'Proporción de la demanda total de viajeros capturada por un operador específico en un corredor o periodo respecto al conjunto de operadores en competencia.', 'round(100.0 * viajeros_operador / total_viajeros_corredor, 2)', 'Cuota, Participación de mercado', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_mercado_trimestral</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ mercado_trimestral</span>', '<a href="/superset/dashboard/mercado-corredor/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 mercado-corredor</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ cuota_maxima</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ filas_minimas</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ grano_unico</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Viajeros (Pax)</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Corredor Ferroviario</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Servicios Comerciales Liberalizados</span>'),
      ('Desagregación Temporal Calibrada (DTC)', 'Negocio Ferroviario', 'Técnico', 'El reparto del total de un trimestre entre sus días. A cada día se le da un índice según el día de la semana, el mes y si es festivo, víspera, puente o regreso, y después se recalibra para que la suma de los días dé EXACTAMENTE el total del trimestre. Se hace con fracciones exactas y método del mayor resto, no con coma flotante, por eso el error de recalibración es 0,0 exacto y no 0,0001.', 'viajeros(día) = total(T) × índice(día) / Σ índices(T)', 'DTC, Reparto diario', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_prediccion_demanda</span>', '<a href="/superset/dashboard/prediccion-demanda/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 prediccion-demanda</a>, <a href="/superset/dashboard/panel-direccion/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 panel-direccion</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ filas_minimas</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Regla de nivel</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Índice de reparto diario</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Procedencia del dato</span>'),
      ('Distancia media del viaje', 'Negocio Ferroviario', 'Negocio', 'Cuántos kilómetros recorre un viajero de media. Es MEDIBLE porque la CNMC publica viajeros y viajeros·km del corredor, y su cociente da 507,9 km de media en los seis últimos trimestres. Sirve de diana: los pesos del reparto entre pares están calibrados para que el modelo reproduzca esa cifra (da 508,3 km), y un test salta si alguien los cambia.', 'SUM(viajeros_km) / SUM(viajeros)', 'Recorrido medio, Longitud media del trayecto', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ cnmc_trimestral</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_viajeros</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_mercado_trimestral</span>', '<a href="/superset/dashboard/mercado-corredor/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 mercado-corredor</a>, <a href="/superset/dashboard/demanda-ferroviaria/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 demanda-ferroviaria</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ viajeros_km_coherente</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Viajeros·km</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Punto kilométrico</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Modelo de gravedad</span>'),
      ('Elasticidad precio-demanda', 'Negocio Ferroviario', 'Negocio', 'Cuánto cae la demanda cuando sube el precio. En este proyecto NO se pudo medir: la regresión de panel con los datos de la CNMC da −0,299 con un error estándar de 0,453, o sea ruido, porque el corredor está limitado por capacidad (el precio subió un 72 % entre 2023-T1 y 2025-T4 con los viajeros planos) y porque precio y demanda se determinan a la vez. Se DECLARA en −1,00, que cae dentro del intervalo de confianza y es el valor neutro, y queda escrito en config/reglas_demanda.yml que es un supuesto, no una medición.', '-', 'Elasticidad, Sensibilidad al precio', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_precio_recomendado</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ cnmc_precio_trimestral</span>', '<a href="/superset/dashboard/panel-direccion/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 panel-direccion</a>', '-', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Precio recomendado</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Rango observado</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Procedencia del dato</span>'),
      ('Hora punta y hora valle', 'Negocio Ferroviario', 'Negocio', 'Las franjas horarias de salida en las que se reparte la oferta y la demanda del día: punta es mañana (6-9) y tarde (15-19); el resto es valle. Los trenes por franja son dato medido del NAP; el reparto de la demanda entre franjas es hipótesis del proyecto, así que la ocupación por franja es un dato derivado.', '-', 'Franja horaria, Pico y valle', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_ocupacion_franja</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ oferta_franja</span>', '<a href="/superset/dashboard/panel-direccion/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 panel-direccion</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ grano_unico</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Ocupación (Factor de Carga)</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Precio recomendado</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Procedencia del dato</span>'),
      ('Intervalo de confianza del 90 %', 'Negocio Ferroviario', 'Técnico', 'La banda entre la que se espera que caiga la demanda real. No es un margen inventado: se predijeron los 24 trimestres ya publicados con la misma regla, como si no se supiera el resultado, y la banda es el reparto de los errores que cometió. Lleva su propio control: la cobertura MEDIDA (cuántas veces el valor real cayó dentro) es del 87,5 % frente al 90 % declarado, así que la banda se queda algo corta y eso se publica junto al dato.', '-', 'Banda de confianza, IC 90 %, Escenario bajo y alto', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_prediccion_demanda</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_metricas_modelo</span>', '<a href="/superset/dashboard/prediccion-demanda/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 prediccion-demanda</a>, <a href="/superset/dashboard/panel-direccion/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 panel-direccion</a>', '-', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Regla de nivel</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Backtest (validación temporal)</span>'),
      ('Modelo de gravedad', 'Negocio Ferroviario', 'Técnico', 'Cómo se reparte la demanda del corredor entre pares de estaciones: el flujo entre dos estaciones es proporcional al producto de sus pesos. Es la parte SINTÉTICA del dato de viajeros, porque nadie publica viajeros por par, pero es contrastable por su agregado: los pesos están calibrados contra la distancia media del viaje. Madrid–Barcelona se lleva el 63,5 % de los viajes, que es lo que se espera de este eje.', 'flujo(A→B) ∝ peso(A) × peso(B)', 'Reparto entre pares', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ viajeros_enriquecidos</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_viajeros</span>', '<a href="/superset/dashboard/demanda-ferroviaria/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 demanda-ferroviaria</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ par_con_dos_estaciones</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ viajeros_km_coherente</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Par origen-destino</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Distancia media del viaje</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Procedencia del dato</span>'),
      ('Obligación de Servicio Público (OSP)', 'Negocio Ferroviario', 'Negocio', 'Servicios de transporte de viajeros garantizados por el Estado o administraciones autonómicas con compensaciones económicas públicas (p. ej. Cercanías, Media Distancia Convencional, Ancho Métrico).', '-', 'OSP, Servicio público regulado', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ cnmc_indicadores</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ cnmc_viajeros_producto</span>', '<a href="/superset/dashboard/mercado-corredor/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 mercado-corredor</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ empresas_conocidas</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ filas_minimas</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Servicios Comerciales Liberalizados</span>'),
      ('Ocupación (Factor de Carga)', 'Negocio Ferroviario', 'Negocio', 'Porcentaje de aprovechamiento de la capacidad disponible, calculado como el cociente entre viajeros·km y plazas·km ofertadas (o viajeros entre plazas ofertadas).', 'round(100.0 * SUM(viajeros_km) / SUM(plazas_km), 2)', 'Load Factor, Factor de ocupación', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_mercado_trimestral</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ cnmc_trimestral</span>', '<a href="/superset/dashboard/mercado-corredor/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 mercado-corredor</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ volumenes_no_negativos</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ filas_minimas</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Viajeros (Pax)</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Plazas Ofertadas</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Viajeros·km</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Plazas·km Ofertadas</span>'),
      ('Ocupación imposible (no plausible)', 'Negocio Ferroviario', 'Técnico', 'Un día cuya ocupación calculada llega al 100 % o lo pasa, lo que no puede ser. No es un error de cálculo sino la consecuencia de que la oferta del NAP NO incluye a Iryo —que no publica horarios— mientras que la demanda de la CNMC sí lo incluye: demanda de tres operadores entre la oferta de dos. Esos días se marcan y se excluyen de las medias; en el panel se pintan en rojo en vez de dejar un hueco, para que el aviso se vea.', 'ocupación ≥ 1,00', 'Día imposible, Marca plausible', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_ocupacion_diaria</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_ocupacion_franja</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_precio_recomendado</span>', '<a href="/superset/dashboard/panel-direccion/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 panel-direccion</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ ocupacion_en_rango</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Ocupación (Factor de Carga)</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Cobertura completa del snapshot</span>'),
      ('Par origen-destino', 'Negocio Ferroviario', 'Negocio', 'El grano de fact_viajeros desde el 17 de octubre de 2026: una fila es «viajes de la estación A a la B ese día con ese operador». Antes había una fila por estación, y un total por estación NO es un número de viajes, porque quien va de Madrid a Barcelona aparece en las dos puntas. Con el par, la suma del día es el número de viajes del corredor, y la vista por estación sale de sumar los pares que salen o llegan a ella.', '-', 'Par O/D, Trayecto, Relación origen-destino', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_viajeros</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ viajeros_enriquecidos</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ dim_estacion</span>', '<a href="/superset/dashboard/demanda-ferroviaria/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 demanda-ferroviaria</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ par_con_dos_estaciones</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ grano_unico</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ distancia_positiva</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Grano de Datos (Granularidad)</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Punto kilométrico</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Modelo de gravedad</span>'),
      ('Plazas Ofertadas', 'Negocio Ferroviario', 'Negocio', 'Capacidad nominal máxima de asientos comercializados por los operadores ferroviarios en las circulaciones puestas a disposición del público.', 'SUM(plazas_ofertadas)', 'Capacidad, Asientos disponibles', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_mercado_trimestral</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ cnmc_viajeros_corredor</span>', '<a href="/superset/dashboard/mercado-corredor/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 mercado-corredor</a>, <a href="/superset/dashboard/demanda-ferroviaria/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 demanda-ferroviaria</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ volumenes_no_negativos</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ filas_minimas</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Viajeros (Pax)</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Plazas·km Ofertadas</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Ocupación (Factor de Carga)</span>'),
      ('Plazas·km Ofertadas', 'Negocio Ferroviario', 'Negocio', 'Medida de oferta total de capacidad: las plazas ofertadas de cada tren por los kilómetros de su recorrido. Como viajeros·km, la CNMC la publica ya agregada por trimestre y el proyecto la suma tal cual.', 'SUM(plazas_km)', 'Asientos-kilómetro ofertados (AKO)', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ cnmc_trimestral</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_mercado_trimestral</span>', '<a href="/superset/dashboard/mercado-corredor/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 mercado-corredor</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ volumenes_no_negativos</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ filas_minimas</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Plazas Ofertadas</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Viajeros·km</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Ocupación (Factor de Carga)</span>'),
      ('Precio Medio por Trayecto', 'Negocio Ferroviario', 'Negocio', 'Importe promedio del billete abonado por viajero para un par origen-destino determinado en el periodo de análisis.', 'AVG(precio_medio_eur)', 'Tarifa media, Average Fare', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_precio_mensual</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_precio_trimestral</span>', '<a href="/superset/dashboard/mercado-corredor/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 mercado-corredor</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ precio_positivo</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ filas_minimas</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Viajeros (Pax)</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Cuota de Mercado (Market Share)</span>'),
      ('Precio recomendado', 'Negocio Ferroviario', 'Negocio', 'El precio que el sistema propone para un día, franja y operador. Parte del precio medio REAL que publica la CNMC y le aplica la elasticidad según la ocupación estimada de esa franja: si va llena sube, si va vacía baja. Después se acota al rango observado. No es un precio de venta: es una recomendación sobre un dato real.', 'precio_base × (ocupación / ocupación_referencia) ^ (1 / |elasticidad|)', 'Precio sugerido, Recomendación de precio', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_precio_recomendado</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ cnmc_precio_trimestral</span>', '<a href="/superset/dashboard/panel-direccion/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 panel-direccion</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ precio_en_rango</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Precio Medio por Trayecto</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Rango observado</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Elasticidad precio-demanda</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Hora punta y hora valle</span>'),
      ('Procedencia del dato', 'Negocio Ferroviario', 'Técnico', 'La clasificación que vertebra todo el gobierno del dato del proyecto. REAL: viene de una fuente publicada y no se toca (CNMC, NAP, INE, AEMET, BOE). DERIVADO: se calcula a partir de datos reales con una regla escrita (la ocupación diaria, el precio recomendado). SINTÉTICO: lo genera el proyecto porque no existe como dato abierto (el reparto de viajes entre pares de estaciones). En el panel de dirección, las tarjetas con filo turquesa son las que el proyecto estima; las demás vienen de una fuente.', '-', 'Dato real frente a derivado o sintético, Medido frente a estimado', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_viajeros</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_ocupacion_diaria</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_precio_recomendado</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_mercado_trimestral</span>', '<a href="/superset/dashboard/panel-direccion/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 panel-direccion</a>, <a href="/superset/dashboard/catalogo-datos-glosario/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 catalogo-datos-glosario</a>', '-', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Regla de nivel</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Desagregación Temporal Calibrada (DTC)</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Modelo de gravedad</span>'),
      ('Punto kilométrico', 'Negocio Ferroviario', 'Técnico', 'La distancia de cada parada desde el origen de la línea, medida sobre la vía: 0 en Madrid, 307 en Zaragoza, 528 en Camp de Tarragona y 621 en Barcelona, que son los 621 km publicados del corredor. Con ellos la distancia entre dos paradas es una resta, y de ahí salen los viajeros·km calculados desde abajo en vez de copiarlos ya agregados.', 'distancia_km(A, B) = |pk(B) − pk(A)|', 'PK, Kilometraje', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_viajeros</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ dim_estacion</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ dim_linea</span>', '<a href="/superset/dashboard/demanda-ferroviaria/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 demanda-ferroviaria</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ distancia_positiva</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ viajeros_km_coherente</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Par origen-destino</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Viajeros·km</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Distancia media del viaje</span>'),
      ('Puntualidad Comercial', 'Negocio Ferroviario', 'Negocio', 'Porcentaje de servicios ferroviarios que llegan a destino o estación intermedia dentro del margen de tolerancia de retraso establecido (en alta velocidad habitualmente < 5 minutos).', 'round(100.0 * COUNT(CASE WHEN retraso_minutos <= 5 THEN 1 END) / COUNT(*), 2)', 'On-Time Performance (OTP), Índice de puntualidad', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_puntualidad</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ puntualidad_servicios</span>', '<a href="/superset/dashboard/puntualidad/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 puntualidad</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ retraso_no_negativo</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ realizado_con_retraso</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ cancelado_sin_retraso</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Retraso Medio</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Tasa de Cancelación</span>'),
      ('Rango observado', 'Negocio Ferroviario', 'Técnico', 'El mínimo y el máximo que ese operador ha cobrado de verdad según la CNMC. Toda recomendación se acota a él, y el porcentaje de recomendaciones que caen dentro SIN necesidad de recorte (86,2 %) es el indicador de credibilidad del modelo: sin el recorte, la regla llegaba a pedir 289,71 € por un Madrid–Barcelona en AVE cuando Renfe nunca ha pasado de 95,58 €.', 'min(precio_eur) … max(precio_eur) por operador', 'Rango real, Acotado al precio observado', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_precio_recomendado</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ cnmc_precio_trimestral</span>', '<a href="/superset/dashboard/panel-direccion/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 panel-direccion</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ precio_en_rango</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Precio recomendado</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Precio Medio por Trayecto</span>'),
      ('Regla de nivel', 'Negocio Ferroviario', 'Negocio', 'Cómo se estima el total de viajeros de un trimestre que todavía no ha publicado la CNMC: se parte del mismo trimestre del año anterior y se le aplica la variación interanual del último trimestre conocido. Nunca mira al trimestre que predice, así que no hay fuga de información del futuro.', 'total(T) = total(T−4) × total(U) / total(U−4)', 'Estimación del total trimestral', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ cnmc_trimestral</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_prediccion_demanda</span>', '<a href="/superset/dashboard/prediccion-demanda/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 prediccion-demanda</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ filas_minimas</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Desagregación Temporal Calibrada (DTC)</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Intervalo de confianza del 90 %</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Procedencia del dato</span>'),
      ('Retraso Medio', 'Negocio Ferroviario', 'Negocio', 'Tiempo medio en minutos de demora acumulada por los trenes en circulación respecto al horario comercial teórico programado.', 'AVG(retraso_minutos)', 'Demora media, Delay', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_puntualidad</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ puntualidad_servicios</span>', '<a href="/superset/dashboard/puntualidad/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 puntualidad</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ retraso_no_negativo</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ realizado_con_retraso</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Puntualidad Comercial</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Tasa de Cancelación</span>'),
      ('Servicios Comerciales Liberalizados', 'Negocio Ferroviario', 'Negocio', 'Servicios ferroviarios de Alta Velocidad y Larga Distancia explotados a riesgo y ventura de empresas ferroviarias autorizadas en régimen de competencia efectiva (Renfe Viajeros, ILSA / Iryo, Ouigo España).', '-', 'Servicios liberalizados, Larga Distancia AV', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_mercado_trimestral</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ dim_operador</span>', '<a href="/superset/dashboard/mercado-corredor/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 mercado-corredor</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ corredor_madrid_barcelona_presente</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ operadores_en_viajeros</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Obligación de Servicio Público (OSP)</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Cuota de Mercado (Market Share)</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Corredor Ferroviario</span>'),
      ('Tasa de Cancelación', 'Negocio Ferroviario', 'Negocio', 'Porcentaje de circulaciones programadas que fueron suprimidas o canceladas sin prestar el servicio a los viajeros.', 'round(100.0 * COUNT(CASE WHEN estado_servicio = ''cancelado'' THEN 1 END) / COUNT(*), 2)', 'Servicios cancelados', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_puntualidad</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ puntualidad_servicios</span>', '<a href="/superset/dashboard/puntualidad/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 puntualidad</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ estado_valido</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ cancelado_sin_retraso</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Puntualidad Comercial</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Retraso Medio</span>'),
      ('Tren·km', 'Negocio Ferroviario', 'Negocio', 'Distancia total en kilómetros recorrida por las composiciones de tren en servicio comercial, con independencia del número de viajeros o coches.', 'SUM(tren_km)', 'Trenes-kilómetro', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_mercado_trimestral</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ cnmc_indicadores</span>', '<a href="/superset/dashboard/mercado-corredor/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 mercado-corredor</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ volumenes_no_negativos</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ filas_minimas</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Viajeros (Pax)</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Puntualidad Comercial</span>'),
      ('Viajeros (Pax)', 'Negocio Ferroviario', 'Negocio', 'Número de pasajeros que utilizan un servicio de transporte ferroviario durante un trayecto o periodo temporal determinado.', 'SUM(viajeros)', 'Pasajeros, Pax, Demanda', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_viajeros</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_mercado_trimestral</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ cnmc_viajeros_corredor</span>', '<a href="/superset/dashboard/mercado-corredor/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 mercado-corredor</a>, <a href="/superset/dashboard/demanda-ferroviaria/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 demanda-ferroviaria</a>, <a href="/superset/dashboard/prediccion-demanda/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 prediccion-demanda</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ filas_minimas</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ viajeros_no_negativos</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ no_nulos_claves</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ viajeros_positivos</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Plazas Ofertadas</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Ocupación (Factor de Carga)</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Viajeros·km</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Cuota de Mercado (Market Share)</span>'),
      ('Viajeros·km', 'Negocio Ferroviario', 'Negocio', 'Unidad compuesta de producción y demanda que representa el transporte de un viajero a lo largo de un kilómetro de distancia. Llega por dos caminos: la CNMC lo publica ya agregado por trimestre (fact_mercado_trimestral), y desde el cambio al grano origen-destino fact_viajeros lo calcula desde abajo, viaje a viaje por la distancia de su par de estaciones. Los dos caminos se pueden contrastar, que es para lo que sirve tenerlos.', 'SUM(viajeros_km)', 'Pasajeros-kilómetro, Tráfico de viajeros', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ cnmc_trimestral</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_mercado_trimestral</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_viajeros</span>', '<a href="/superset/dashboard/mercado-corredor/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 mercado-corredor</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ volumenes_no_negativos</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ filas_minimas</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Viajeros (Pax)</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Plazas·km Ofertadas</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Ocupación (Factor de Carga)</span>'),
      ('Índice de reparto diario', 'Negocio Ferroviario', 'Negocio', 'Cuántas veces un día normal del trimestre es un día concreto. La media del trimestre vale 1 por construcción, así que 1,357 es un 36 % por encima de un día medio y 0,692 un 31 % por debajo. Sale de multiplicar el coeficiente del día de la semana, el perfil del mes (calibrado con el turismo del INE) y los de día especial. La columna «motivo» de la predicción dice en palabras de dónde sale cada uno.', 'índice(día) = base_día_semana × perfil_mes × factores_día_especial', 'Índice del día, Factor del día', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_prediccion_demanda</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_turismo_mensual</span>', '<a href="/superset/dashboard/prediccion-demanda/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 prediccion-demanda</a>, <a href="/superset/dashboard/panel-direccion/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 panel-direccion</a>', '-', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Desagregación Temporal Calibrada (DTC)</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Regla de nivel</span>'),
      ('Arquitectura Medallion', 'Plataforma Data Lakehouse', 'Técnico', 'Patrón de diseño de ingeniería de datos que organiza el almacenamiento en tres capas progresivas de calidad y refinamiento: Bronze (bruto/ingesta), Silver (limpio/conforme) y Gold (agregado/dimensional).', '-', 'Capas Bronze/Silver/Gold', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ _trazabilidad/cargas</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ lineage_nodos</span>', '<a href="/superset/dashboard/lineage-cargas/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 lineage-cargas</a>, <a href="/superset/dashboard/catalogo-datos-glosario/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 catalogo-datos-glosario</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ filas_minimas</span>, <span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ grano_unico</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Capa Bronze L1 (Raw)</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Capa Bronze L2 (Parquet)</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Capa Silver</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Capa Gold</span>'),
      ('Backtest (validación temporal)', 'Plataforma Data Lakehouse', 'Técnico', 'Medir una regla o un modelo prediciendo periodos YA conocidos, siempre hacia adelante: se entrena con lo anterior a una fecha y se mide contra lo posterior. Es la única partición válida con series temporales; una partición aleatoria deja ver el futuro al modelo y da un número bonito y falso.', '-', 'Validación temporal, Walk-forward', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_metricas_modelo</span>', '<a href="/superset/dashboard/prediccion-demanda/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 prediccion-demanda</a>, <a href="/superset/dashboard/panel-direccion/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 panel-direccion</a>', '-', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Intervalo de confianza del 90 %</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Regla de nivel</span>'),
      ('Capa Bronze L1 (Raw)', 'Plataforma Data Lakehouse', 'Técnico', 'Almacenamiento inmutable en MinIO que preserva los ficheros tal como fueron descargados de las fuentes externas (CSV, JSON, ZIP), sirviendo como copia forense auditable.', '-', 'L1, Bronze Raw', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ _trazabilidad/cargas</span>', '<a href="/superset/dashboard/lineage-cargas/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 lineage-cargas</a>, <a href="/superset/dashboard/trazabilidad-cargas/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 trazabilidad-cargas</a>, <a href="/superset/dashboard/catalogo-datos-glosario/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 catalogo-datos-glosario</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ carga_correcta</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Arquitectura Medallion</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Capa Bronze L2 (Parquet)</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Trazabilidad de Cargas</span>'),
      ('Capa Bronze L2 (Parquet)', 'Plataforma Data Lakehouse', 'Técnico', 'Transformación técnica streaming/batch de L1 a formato Parquet columnar optimizado, descomprimiendo ZIPs (p. ej. GTFS) y preservando los esquemas fuente.', '-', 'L2, Bronze Parquet', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ _trazabilidad/cargas</span>', '<a href="/superset/dashboard/lineage-cargas/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 lineage-cargas</a>, <a href="/superset/dashboard/trazabilidad-cargas/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 trazabilidad-cargas</a>, <a href="/superset/dashboard/catalogo-datos-glosario/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 catalogo-datos-glosario</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ carga_correcta</span>', '<span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Arquitectura Medallion</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Capa Bronze L1 (Raw)</span>, <span style="display:inline-block;background:#e6fffa;color:#234e52;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #b2f5ea;font-weight:600;">📖 Capa Silver</span>'),
      ('Capa Gold', 'Plataforma Data Lakehouse', 'Técnico', 'Modelos dimensionales analíticos (esquema en estrella con tablas de hechos y dimensiones) almacenados en Parquet/MinIO, listos para consumo directo desde BI (DuckDB + Superset).', '-', 'Gold, Data Marts', '<span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ dim_fecha</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ dim_estacion</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_viajeros</span>, <span style="display:inline-block;background:#feebc8;color:#744210;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #fbd38d;">🗄️ fact_mercado_trimestral</span>', '<a href="/superset/dashboard/lineage-cargas/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 lineage-cargas</a>, <a href="/superset/dashboard/trazabilidad-cargas/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 trazabilidad-cargas</a>, <a href="/superset/dashboard/catalogo-datos-glosario/" target="_blank" style="display:inline-block;background:#2b6cb0;color:#ffffff;padding:2px 7px;margin:2px 3px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:600;">📊 catalogo-datos-glosario</a>', '<span style="display:inline-block;background:#f7fafc;color:#4a5568;padding:2px 6px;margin:2px 3px;border-radius:4px;font-size:11px;border:1px solid #cbd5e0;">🛡️ filas_minimas</span>, <span style="display:inline-block;bac