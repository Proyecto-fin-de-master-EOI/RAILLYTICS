table_name: calidad
main_dttm_col: inicio
description: 'Resultados de los quality gates del lake (raillytics.common.calidad.QualityGates en Scala y
  raillytics.calidad en Python): una fila por gate evaluado, con el run_id de la carga a la que pertenece,
  leída de s3://raillytics-gold/_trazabilidad/calidad/.'
default_endpoint: null
offset: 0
cache_timeout: null
schema: null
catalog: null
sql: |-
  -- Quality gates: una fila por ejecución, tabla y gate. Se cruza con la
  -- trazabilidad de cargas por run_id. inicio y fin se guardan en UTC.
  SELECT
      run_id,
      proceso,
      capa,
      tabla,
      gate,
      tipo,
      severidad,
      resultado,
      CASE WHEN resultado <> 'ok' AND severidad = 'bloqueante' THEN 1 ELSE 0 END AS bloqueante_fallido,
      valor,
      umbral,
      detalle,
      timezone('Europe/Madrid', timezone('UTC', inicio)) AS inicio,
      timezone('Europe/Madrid', timezone('UTC', fin))    AS fin,
      duracion_s,
      lanzado_por,
      ejecutor,
      usuario
  FROM read_parquet('s3://raillytics-gold/_trazabilidad/calidad/*.parquet', union_by_name = true)
params: null
