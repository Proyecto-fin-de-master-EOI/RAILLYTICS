table_name: cobertura_ingesta
main_dttm_col: fecha
description: 'KPI de completitud de la ingesta que pide el plan del Sprint 2: fuentes del registro descargadas correctamente
  sobre el total de fuentes declaradas, con umbral del 98 %. No confundir con el «% de quality gates OK»: aquel mide cuántas
  reglas se cumplen y este cuánto dato falta. Se pueden tener todos los gates en verde y faltar meses de datos. El denominador
  es el registro de HOY, así que un día anterior al alta de una fuente nueva sale por debajo del 100 %: compara «fuentes intentadas»
  con «esperadas» para distinguir un fallo real de un registro que ha crecido.'
default_endpoint: null
offset: 0
cache_timeout: null
schema: null
catalog: null
sql: "-- Completitud de la ingesta: fuentes obligatorias descargadas OK sobre el total del registro.\n-- NO es lo mismo que\
  \ el «% de quality gates OK», que mide cuantas REGLAS se cumplen. Se pueden tener\n-- todos los gates en verde y faltar\
  \ meses de datos, porque ningun gate pregunta si estan todos los\n-- dias ni si se intentaron todas las fuentes.\n--\n--\
  \ La metrica pilla las dos averias que importan y son distintas: una fuente que se intento y FALLO, y\n-- una del registro\
  \ que NI SE INTENTO, que es la que no sale en ningun log de error. `fuentes_intentadas`\n-- sirve para distinguirlas.\n\
  --\n-- El denominador es el registro de HOY, asi que un dia anterior a dar de alta una fuente nueva sale\n-- por debajo\
  \ del 100 %. Es deliberado: la pregunta es «tengo hoy todo lo que el proyecto necesita».\nSELECT\n    fecha,\n    fuentes_esperadas,\n\
  \    fuentes_intentadas,\n    ok_del_registro                                        AS fuentes_ok,\n    fuentes_esperadas\
  \ - ok_del_registro                     AS fuentes_que_faltan,\n    cobertura,\n    umbral,\n    cumple_umbral,\n    cargas,\n\
  \    fecha = max(fecha) OVER ()                              AS es_ultima\nFROM read_parquet('s3://raillytics-gold/fact_cobertura_ingesta/*.parquet')"
