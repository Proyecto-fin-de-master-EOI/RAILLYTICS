slice_name: Exceso sobre un día corriente por ejecución
description: 'Coherencia del reparto en los días que dependen de los de alrededor: cuánto se separa su índice del de un día corriente
  del mismo día de la semana. +0.00 = la regla no se aplica. Con las reglas de demanda_v3 se espera que vísperas, regresos y días junto
  a un evento queden por encima y los puentes por debajo (cuentan como festivo). Las ejecuciones publicadas antes de esta métrica salen
  vacías.'
