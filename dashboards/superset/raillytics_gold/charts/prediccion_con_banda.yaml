slice_name: Demanda diaria prevista, con su intervalo del 90 %
description: La banda sale de los errores que la regla de nivel cometió en 24 trimestres ya publicados. Cubre la incertidumbre
  del total trimestral, que es donde está el error grande, no la del reparto entre días.
