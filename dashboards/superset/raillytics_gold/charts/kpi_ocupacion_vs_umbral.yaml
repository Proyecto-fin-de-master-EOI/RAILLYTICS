slice_name: Factor de ocupación
description: 'KPI de negocio del plan del Sprint 2. El umbral del plan era «> 85 %» y está en «> 72 %»: primero porque la
  fórmula correcta es viajeros·km / plazas·km y no viajeros por plaza —por km el 100 % es un techo real—, y después porque
  la serie es muy estacional, con 9,4 puntos entre el T1 y el T2, así que un umbral plano por encima del 74 % no avisa de
  anomalías, avisa de que es invierno. El 72 % es el percentil 10 de la serie 2023-2026. Solo entran los días plausibles.'
