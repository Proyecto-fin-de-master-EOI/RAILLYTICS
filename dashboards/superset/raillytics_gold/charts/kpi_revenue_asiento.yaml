slice_name: Ingreso por asiento ofertado (€)
description: 'KPI de negocio del plan del Sprint 2. Dato real de la CNMC: los ingresos vienen en la fila TOTAL del corredor
  y las plazas en las de cada operador, así que se suman ambas por trimestre. No es el precio del billete: es cuánto ingresa
  el corredor por cada asiento que pone a la venta, se venda o no.'
