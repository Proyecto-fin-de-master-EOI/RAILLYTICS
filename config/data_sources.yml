# Registro de fuentes de la ingesta Bronze. Lo leen la descarga Python
# (raillytics.ingesta.sources) y la app Scala L2 (DataSourceConfig).
#
# format: csv | json | zip (ver raillytics/ingesta/formats.py y SourceFormat.scala).
# La descarga comprueba que el contenido recibido ES ese formato (quality gate
# formato_declarado): un fichero que no lo cumple va a cuarentena, no al pipeline.
sources:
  - id: crtm
    name: "CRTM - Consorcio Regional de Transportes de Madrid (GTFS estático)"
    url: "https://crtm.maps.arcgis.com/sharing/rest/content/items/1a25440bf66f499bae2657ec7fb40144/data"
    # El servidor devuelve application/zip (google_transit_M5.zip): un GTFS con
    # stops.txt, routes.txt, trips.txt... L2 deja un Parquet por miembro.
    format: zip
  - id: renfe_trip_updates
    name: "Renfe GTFS-RT - Actualizaciones de viaje (Larga Distancia)"
    url: "https://gtfsrt.renfe.com/trip_updates_LD.json"
    format: json
  - id: renfe_vehicle_positions
    name: "Renfe GTFS-RT - Posiciones de vehículos (Larga Distancia)"
    url: "https://gtfsrt.renfe.com/vehicle_positions_LD.json"
    format: json
  # === CNMC - Comisión Nacional de los Mercados y la Competencia ===
  # Catálogo CKAN en https://catalogodatos.cnmc.es (ojo: el portal público
  # data.cnmc.es es un Drupal sin API). Publicación trimestral, periodo
  # 2016T1-2026T2, licencia CC-BY-SA-4.0.
  #
  # Se usa el JSON y no el CSV a propósito: el CSV de CNMC viene con separador
  # ';', coma decimal y BOM, y el lector csv de este framework solo fija
  # header=true (SourceFormat.readerOptions), con lo que Spark lo convertiría a
  # un Parquet de una única columna. El JSON es un array de objetos con las
  # claves ya en snake_case y los valores numéricos.
  - id: cnmc_ocupacion_viajeros
    name: "CNMC - Indicadores trimestrales del transporte ferroviario de viajeros (ds_24406_1)"
    url: "https://catalogodatos.cnmc.es/dataset/e608b7b2-0b3a-4816-a4f2-54eb3d913790/resource/998d0f03-4cc0-4b3f-9012-0f55c1b14adb/download/ds_24406_1.json"
    format: json
  - id: cnmc_precio_medio
    name: "CNMC - Indicador del precio medio trimestral por trayecto (ds_24409_1)"
    url: "https://catalogodatos.cnmc.es/dataset/ed44fc19-79d5-4222-b724-81e430c29a36/resource/348996f0-efbd-419d-a82f-ca55b7fe137e/download/ds_24409_1.json"
    format: json
