# Catálogo de Datos (Data Catalog) - Raillytics
# Registro y diccionario técnico de datasets de todas las capas del Data Lakehouse.
version: 1.0.0

tablas:
  # ==============================================================================================
  # CAPA GOLD: Modelos dimensionales (Hechos y Dimensiones)
  # ==============================================================================================
  - tabla: fact_mercado_trimestral
    nombre: Hecho de Mercado Trimestral
    capa: Gold
    orden_capa: 6
    dominio: Mercado y Competencia
    descripcion: Indicadores trimestrales agregados del mercado ferroviario de alta velocidad por corredor y operador. Incluye viajeros, plazas, trenes-km, ingresos y cuota de mercado.
    grano: Un trimestre, corredor y operador ferroviario
    claves: [trimestre, corredor, operador_id]
    formato: Parquet
    proceso: gold_build
    frecuencia: Trimestral
    quality_gates: [filas_minimas, grano_unico, no_nulos_claves, cuota_maxima]
    upstream: [silver:cnmc_trimestral, gold:dim_operador]
    downstream: [dataset:mercado_trimestral, dashboard:mercado-corredor]
    columnas:
      - {nombre: trimestre, tipo: VARCHAR, descripcion: "Código de trimestre en formato AAAA-TX (ej. 2026-T2)", es_clave: true}
      - {nombre: corredor, tipo: VARCHAR, descripcion: "Nombre normalizado del corredor ferroviario", es_clave: true}
      - {nombre: operador_id, tipo: VARCHAR, descripcion: "Identificador del operador ferroviario", es_clave: true}
      - {nombre: viajeros, tipo: BIGINT, descripcion: "Total de viajeros transportados", es_clave: false, termino_glosario: "Viajeros (Pax)"}
      - {nombre: plazas_ofertadas, tipo: BIGINT, descripcion: "Total de plazas comerciales ofertadas", es_clave: false, termino_glosario: "Plazas Ofertadas"}
      - {nombre: tren_km, tipo: DOUBLE, descripcion: "Kilómetros totales recorridos por las composiciones", es_clave: false, termino_glosario: "Tren·km"}
      # Las publica la CNMC ya agregadas por trimestre: el proyecto no multiplica por ninguna
      # distancia, no hay tabla con la longitud de cada trayecto.
      - {nombre: viajeros_km, tipo: DOUBLE, descripcion: "Viajeros por kilómetro recorrido, tal y como los publica la CNMC", es_clave: false, termino_glosario: "Viajeros·km"}
      - {nombre: plazas_km, tipo: DOUBLE, descripcion: "Plazas ofertadas por kilómetro recorrido, tal y como las publica la CNMC", es_clave: false, termino_glosario: "Plazas·km Ofertadas"}
      - {nombre: ingresos_eur, tipo: DOUBLE, descripcion: "Ingresos comerciales brutos por venta de billetes", es_clave: false}
      - {nombre: cuota_viajeros_pct, tipo: DOUBLE, descripcion: "Porcentaje de cuota de mercado en volumen de viajeros", es_clave: false, termino_glosario: "Cuota de Mercado (Market Share)"}

  - tabla: fact_viajeros
    nombre: Hecho de Viajeros Diarios
    capa: Gold
    orden_capa: 6
    dominio: Demanda y Tráfico
    descripcion: Registro de demanda de viajeros transportados por fecha, línea, operador y par origen-destino de estaciones.
    grano: Un día, línea, operador, estación de origen y estación de destino
    claves: [fecha, linea_id, operador_id, estacion_origen_id, estacion_destino_id]
    formato: Parquet
    proceso: gold_build
    frecuencia: Diario (Batch)
    quality_gates: [filas_minimas, no_nulos_claves, viajeros_positivos]
    upstream: [silver:viajeros_enriquecidos, gold:dim_linea, gold:dim_estacion, gold:dim_operador]
    downstream: [dataset:viajeros_diarios, dashboard:demanda-ferroviaria]
    columnas:
      - {nombre: fecha_id, tipo: INT, descripcion: "Clave de Dim_Fecha en formato AAAAMMDD", es_clave: true}
      - {nombre: fecha, tipo: DATE, descripcion: "Fecha del servicio de transporte", es_clave: true}
      - {nombre: linea_id, tipo: VARCHAR, descripcion: "Identificador de la línea ferroviaria", es_clave: true}
      - {nombre: operador_id, tipo: VARCHAR, descripcion: "Identificador del operador comercial", es_clave: true}
      - {nombre: estacion_origen_id, tipo: VARCHAR, descripcion: "Identificador de la estación de salida", es_clave: true}
      - {nombre: estacion_destino_id, tipo: VARCHAR, descripcion: "Identificador de la estación de llegada", es_clave: true}
      - {nombre: distancia_km, tipo: DOUBLE, descripcion: "Distancia entre las dos estaciones, la resta de sus puntos kilométricos", es_clave: false}
      - {nombre: viajeros, tipo: BIGINT, descripcion: "Número de viajes entre esas dos estaciones ese día", es_clave: false, termino_glosario: "Viajeros (Pax)"}
      - {nombre: viajeros_km, tipo: DOUBLE, descripcion: "Viajeros por la distancia de su par: el viajeros·km calculado desde abajo", es_clave: false, termino_glosario: "Viajeros·km"}
      - {nombre: temperatura_media, tipo: DOUBLE, descripcion: "Temperatura media del día en la provincia de origen (AEMET)", es_clave: false}
      - {nombre: precipitacion_mm, tipo: DOUBLE, descripcion: "Precipitación acumulada del día en la provincia de origen (AEMET)", es_clave: false}
      - {nombre: condicion_meteo, tipo: VARCHAR, descripcion: "Condición meteorológica derivada: despejado, nuboso, lluvia o tormenta", es_clave: false}
      # `plazas_ofertadas` no está aquí a propósito: una plaza es de un tren, no de un par de
      # estaciones, así que repartirla entre los pares que recorre el tren la contaría varias veces.
      # La oferta vive en fact_oferta_diaria, con el grano al que de verdad se mide (día, línea y
      # operador), y la ocupación se calcula allí.

  - tabla: fact_puntualidad
    nombre: Hecho de Puntualidad de Servicios
    capa: Gold
    orden_capa: 6
    dominio: Operaciones y Puntualidad
    descripcion: Registro individualizado de circulaciones con tiempos de retraso, cumplimiento horario y estado operativo del servicio.
    grano: Una circulación/servicio ferroviario en una fecha
    claves: [fecha, servicio_id]
    formato: Parquet
    proceso: gold_build
    frecuencia: Diario / Horario
    quality_gates: [filas_minimas, grano_unico, rango_retraso]
    upstream: [silver:puntualidad_enriquecida, gold:dim_linea, gold:dim_operador]
    downstream: [dataset:puntualidad_servicios, dashboard:puntualidad]
    columnas:
      - {nombre: fecha, tipo: DATE, descripcion: "Fecha programada del servicio", es_clave: true}
      - {nombre: servicio_id, tipo: VARCHAR, descripcion: "Código identificador único de la circulación", es_clave: true}
      - {nombre: operador_id, tipo: VARCHAR, descripcion: "Identificador del operador ferroviario", es_clave: false}
      - {nombre: linea_id, tipo: VARCHAR, descripcion: "Identificador de la línea recorrida", es_clave: false}
      - {nombre: retraso_minutos, tipo: DOUBLE, descripcion: "Minutos de desviación respecto al horario oficial", es_clave: false, termino_glosario: "Retraso Medio"}
      - {nombre: estado_servicio, tipo: VARCHAR, descripcion: "Estado ('puntual', 'retrasado', 'cancelado')", es_clave: false, termino_glosario: "Puntualidad Comercial"}

  - tabla: fact_precio_mensual
    nombre: Hecho de Precios Medios Mensuales
    capa: Gold
    orden_capa: 6
    dominio: Mercado y Tarifas
    descripcion: Evolución mensual del precio medio pagado por trayecto y operador en las principales relaciones comerciales.
    grano: Un mes, trayecto y operador
    claves: [mes, trayecto, operador_id]
    formato: Parquet
    proceso: gold_build
    frecuencia: Mensual
    quality_gates: [filas_minimas, precio_positivo]
    upstream: [silver:cnmc_precio_mensual, gold:dim_operador]
    downstream: [dataset:precio_medio_mensual, dashboard:mercado-corredor]
    columnas:
      - {nombre: mes, tipo: VARCHAR, descripcion: "Año y mes en formato AAAA-MM (ej. 2026-06)", es_clave: true}
      - {nombre: trayecto, tipo: VARCHAR, descripcion: "Relación origen-destino analizada", es_clave: true}
      - {nombre: operador_id, tipo: VARCHAR, descripcion: "Identificador del operador ferroviario", es_clave: true}
      - {nombre: precio_medio_eur, tipo: DOUBLE, descripcion: "Precio medio ponderado del billete en euros", es_clave: false, termino_glosario: "Precio Medio por Trayecto"}

  - tabla: fact_precio_trimestral
    nombre: Hecho de Precios Medios Trimestrales
    capa: Gold
    orden_capa: 6
    dominio: Mercado y Tarifas
    descripcion: Evolución trimestral del precio medio abonado por trayecto comercial.
    grano: Un trimestre, trayecto y operador
    claves: [trimestre, trayecto, operador_id]
    formato: Parquet
    proceso: gold_build
    frecuencia: Trimestral
    quality_gates: [filas_minimas, precio_positivo]
    upstream: [silver:cnmc_precio_trimestral, gold:dim_operador]
    downstream: [dataset:precio_medio_trimestral, dashboard:mercado-corredor]
    columnas:
      - {nombre: trimestre, tipo: VARCHAR, descripcion: "Trimestre en formato AAAA-TX", es_clave: true}
      - {nombre: trayecto, tipo: VARCHAR, descripcion: "Trayecto comercial analizado", es_clave: true}
      - {nombre: operador_id, tipo: VARCHAR, descripcion: "Identificador del operador", es_clave: true}
      - {nombre: precio_medio_eur, tipo: DOUBLE, descripcion: "Precio medio del billete en euros", es_clave: false, termino_glosario: "Precio Medio por Trayecto"}

  - tabla: fact_prediccion_demanda
    nombre: Hecho de Predicciones de Demanda LLM
    capa: Gold
    orden_capa: 6
    dominio: Predicción e IA
    descripcion: Predicciones diarias de demanda desagregada de viajeros generadas mediante modelo de lenguaje local (Ollama) con bandas de confianza y backtest.
    grano: Una fecha y corredor para una versión de modelo
    claves: [fecha, corredor, version]
    formato: Parquet
    proceso: prediccion_demanda
    frecuencia: Batch bajo demanda / Semanal
    quality_gates: [filas_minimas, balance_trimestre, cotas_validas]
    upstream: [pred:prediccion_demanda, silver:cnmc_trimestral]
    downstream: [dataset:prediccion_demanda, dashboard:prediccion-demanda]
    columnas:
      - {nombre: fecha, tipo: DATE, descripcion: "Fecha de la predicción diaria", es_clave: true}
      - {nombre: corredor, tipo: VARCHAR, descripcion: "Código de corredor (ej. AVE-MAD-BCN)", es_clave: true}
      - {nombre: viajeros_previstos, tipo: BIGINT, descripcion: "Estimación central de viajeros previstos", es_clave: false}
      - {nombre: cota_inferior, tipo: BIGINT, descripcion: "Banda de confianza inferior (p10)", es_clave: false}
      - {nombre: cota_superior, tipo: BIGINT, descripcion: "Banda de confianza superior (p90)", es_clave: false}
      - {nombre: modelo, tipo: VARCHAR, descripcion: "Identificador del modelo de inferencia", es_clave: false}
      - {nombre: version, tipo: VARCHAR, descripcion: "Versión de prompt y parámetros", es_clave: true}

  # ------------------------------------------------------------------------------------------------
  # Las tablas que siguen las construye Python, no Spark (ver `proceso`), y son las que faltaban en el
  # catálogo: el lago tiene 18 tablas en Gold y aquí se declaraban 10. Están para que el catálogo
  # describa el lago entero, no solo la parte que mueve Spark.
  # ------------------------------------------------------------------------------------------------
  - tabla: fact_oferta_diaria
    nombre: Hecho de Oferta Diaria
    capa: Gold
    orden_capa: 6
    dominio: Oferta y Capacidad
    descripcion: Trenes puestos en circulación por día, corredor y operador, contados de los horarios publicados en el NAP.
    grano: Un día, corredor y operador
    claves: [fecha, corredor, operador_id]
    formato: Parquet
    proceso: gold_build
    frecuencia: Diario (Batch)
    quality_gates: [filas_minimas, grano_unico, sin_nulos, fecha_en_la_dimension, operador_en_la_dimension, cuadra_con_silver]
    upstream: [silver:oferta_diaria, gold:dim_fecha, gold:dim_operador]
    downstream: [dataset:oferta_diaria, dataset:ocupacion_diaria, dashboard:demanda-ferroviaria]
    columnas:
      - {nombre: fecha_id, tipo: INT, descripcion: "Clave de Dim_Fecha en formato AAAAMMDD", es_clave: true}
      - {nombre: fecha, tipo: DATE, descripcion: "Fecha de circulación", es_clave: true}
      - {nombre: corredor, tipo: VARCHAR, descripcion: "Corredor ferroviario", es_clave: true, termino_glosario: "Corredor Ferroviario"}
      - {nombre: operador_id, tipo: VARCHAR, descripcion: "Identificador del operador comercial", es_clave: true}
      - {nombre: linea_id, tipo: VARCHAR, descripcion: "Identificador de la línea ferroviaria", es_clave: false}
      - {nombre: trenes, tipo: BIGINT, descripcion: "Trenes del día en el corredor, los que cuentan para la oferta", es_clave: false}
      - {nombre: trenes_todos, tipo: BIGINT, descripcion: "Trenes del día del operador en toda su red, para contrastar la cobertura", es_clave: false}
      - {nombre: cobertura_completa, tipo: BOOLEAN, descripcion: "Cierto cuando el snapshot del NAP cubre el día entero", es_clave: false}
      - {nombre: snapshot, tipo: VARCHAR, descripcion: "Snapshot del NAP del que sale el dato", es_clave: false}

  - tabla: fact_ocupacion_diaria
    nombre: Hecho de Ocupación Diaria
    capa: Gold
    orden_capa: 6
    dominio: Demanda y Tráfico
    descripcion: Ocupación diaria implicada del corredor con las variables de calendario y meteorología que la explican; es la tabla con la que se entrena el modelo.
    grano: Un día y corredor
    claves: [fecha, corredor]
    formato: Parquet
    proceso: gold_build
    frecuencia: Diario (Batch)
    quality_gates: [filas_minimas, grano_unico, sin_nulos, fecha_en_la_dimension, cuadra_con_silver]
    upstream: [silver:ml_ocupacion_diaria, gold:dim_fecha]
    downstream: [dataset:ocupacion_diaria, dataset:kpi_plan, dashboard:prediccion-demanda, dashboard:panel-direccion]
    columnas:
      - {nombre: fecha_id, tipo: INT, descripcion: "Clave de Dim_Fecha en formato AAAAMMDD", es_clave: true}
      - {nombre: fecha, tipo: DATE, descripcion: "Fecha del dato", es_clave: true}
      - {nombre: corredor, tipo: VARCHAR, descripcion: "Corredor ferroviario", es_clave: true, termino_glosario: "Corredor Ferroviario"}
      - {nombre: linea_id, tipo: VARCHAR, descripcion: "Identificador de la línea ferroviaria", es_clave: false}
      - {nombre: ocupacion, tipo: DOUBLE, descripcion: "Ocupación implicada del día: la demanda repartida entre la oferta real", es_clave: false, termino_glosario: "Ocupación (Factor de Carga)"}
      - {nombre: plausible, tipo: BOOLEAN, descripcion: "Cierto cuando la ocupación cae en un rango creíble: la marca de calidad del dato derivado", es_clave: false}
      - {nombre: festivo, tipo: BOOLEAN, descripcion: "Día festivo en alguna de las dos cabeceras", es_clave: false}
      - {nombre: festivo_solo_madrid, tipo: BOOLEAN, descripcion: "Festivo solo en Madrid", es_clave: false}
      - {nombre: festivo_solo_cataluna, tipo: BOOLEAN, descripcion: "Festivo solo en Cataluña", es_clave: false}
      - {nombre: vispera, tipo: BOOLEAN, descripcion: "Víspera de festivo", es_clave: false}
      - {nombre: puente, tipo: BOOLEAN, descripcion: "Día dentro de un puente", es_clave: false}
      - {nombre: regreso, tipo: BOOLEAN, descripcion: "Día de regreso de puente o festivo", es_clave: false}
      - {nombre: evento, tipo: BOOLEAN, descripcion: "Día con un evento del corredor (congresos y ferias)", es_clave: false}
      - {nombre: junto_a_evento, tipo: BOOLEAN, descripcion: "Día contiguo a un evento", es_clave: false}
      - {nombre: temperatura_media_mad, tipo: DOUBLE, descripcion: "Temperatura media del día en Madrid (AEMET)", es_clave: false}
      - {nombre: temperatura_media_bcn, tipo: DOUBLE, descripcion: "Temperatura media del día en Barcelona (AEMET)", es_clave: false}
      - {nombre: precipitacion_mm_mad, tipo: DOUBLE, descripcion: "Precipitación del día en Madrid (AEMET)", es_clave: false}
      - {nombre: precipitacion_mm_bcn, tipo: DOUBLE, descripcion: "Precipitación del día en Barcelona (AEMET)", es_clave: false}

  - tabla: fact_ocupacion_franja
    nombre: Hecho de Ocupación por Franja Horaria
    capa: Gold
    orden_capa: 6
    dominio: Demanda y Tráfico
    descripcion: Ocupación estimada por día y franja horaria, con la marca de hora punta; reparte la ocupación diaria entre franjas según la oferta de cada una.
    grano: Un día y franja horaria
    claves: [fecha, franja]
    formato: Parquet
    proceso: ml_franja
    frecuencia: Diario (Batch)
    quality_gates: []   # la construye Python y aún no pasa por los quality gates de Spark;
                        # lo que trae es su propia columna `plausible` fila a fila
    upstream: [silver:oferta_franja, silver:ml_ocupacion_diaria]
    downstream: [dataset:ocupacion_franja, dataset:kpi_plan, gold:fact_precio_recomendado, dashboard:panel-direccion]
    columnas:
      - {nombre: fecha, tipo: DATE, descripcion: "Fecha del dato", es_clave: true}
      - {nombre: franja, tipo: VARCHAR, descripcion: "Franja horaria de salida del tren", es_clave: true}
      - {nombre: es_punta, tipo: BOOLEAN, descripcion: "Cierto si la franja es hora punta", es_clave: false}
      - {nombre: trenes, tipo: DOUBLE, descripcion: "Trenes de la franja", es_clave: false}
      - {nombre: cuota_oferta, tipo: DOUBLE, descripcion: "Parte de la oferta del día que está en esta franja", es_clave: false}
      - {nombre: cuota_demanda, tipo: DOUBLE, descripcion: "Parte de la demanda del día atribuida a esta franja", es_clave: false}
      - {nombre: ocupacion, tipo: DOUBLE, descripcion: "Ocupación estimada de la franja", es_clave: false, termino_glosario: "Ocupación (Factor de Carga)"}
      - {nombre: plazas_vacias, tipo: DOUBLE, descripcion: "Plazas sin vender estimadas en la franja", es_clave: false}
      - {nombre: plausible, tipo: BOOLEAN, descripcion: "Marca de calidad del dato derivado", es_clave: false}

  - tabla: fact_precio_recomendado
    nombre: Hecho de Precio Recomendado
    capa: Gold
    orden_capa: 6
    dominio: Mercado y Tarifas
    descripcion: Precio recomendado por día, franja horaria y operador. Sale del precio real de la CNMC y de la ocupación estimada, por una regla de elasticidad, y se acota al rango de precios que ese operador ha practicado de verdad.
    grano: Un día, franja horaria y operador
    claves: [fecha, franja, operador_id]
    formato: Parquet
    proceso: precio_recomendado
    frecuencia: Diario (Batch)
    quality_gates: []   # la construye Python y aún no pasa por los quality gates de Spark;
                        # lo que trae es su propia columna `plausible` fila a fila
    upstream: [gold:fact_ocupacion_franja, silver:cnmc_precio_trimestral]
    downstream: [dataset:precio_recomendado, dataset:kpi_plan, dashboard:panel-direccion]
    columnas:
      - {nombre: fecha, tipo: DATE, descripcion: "Fecha del precio recomendado", es_clave: true}
      - {nombre: franja, tipo: VARCHAR, descripcion: "Franja horaria de salida", es_clave: true}
      - {nombre: es_punta, tipo: BOOLEAN, descripcion: "Cierto si la franja es hora punta", es_clave: false}
      - {nombre: operador_id, tipo: VARCHAR, descripcion: "Identificador del operador comercial", es_clave: true}
      - {nombre: empresa, tipo: VARCHAR, descripcion: "Empresa ferroviaria, como la nombra la CNMC", es_clave: false}
      - {nombre: precio_base_eur, tipo: DOUBLE, descripcion: "Precio medio real del trimestre, el punto de partida (CNMC)", es_clave: false, termino_glosario: "Precio Medio por Trayecto"}
      - {nombre: precio_min_eur, tipo: DOUBLE, descripcion: "Precio mínimo que ese operador ha practicado de verdad", es_clave: false}
      - {nombre: precio_max_eur, tipo: DOUBLE, descripcion: "Precio máximo que ese operador ha practicado de verdad", es_clave: false}
      - {nombre: ocupacion, tipo: DOUBLE, descripcion: "Ocupación estimada de la franja", es_clave: false, termino_glosario: "Ocupación (Factor de Carga)"}
      - {nombre: ocupacion_referencia, tipo: DOUBLE, descripcion: "Ocupación de referencia sobre la que se mide el exceso de demanda", es_clave: false}
      - {nombre: elasticidad, tipo: DOUBLE, descripcion: "Elasticidad precio-demanda declarada en config/reglas_demanda.yml", es_clave: false}
      - {nombre: factor, tipo: DOUBLE, descripcion: "Factor que se aplica al precio base", es_clave: false}
      - {nombre: precio_sin_acotar_eur, tipo: DOUBLE, descripcion: "Precio antes de acotarlo al rango observado", es_clave: false}
      - {nombre: precio_recomendado_eur, tipo: DOUBLE, descripcion: "Precio recomendado final", es_clave: false}
      - {nombre: variacion, tipo: DOUBLE, descripcion: "Variación sobre el precio base", es_clave: false}
      - {nombre: recortado, tipo: BOOLEAN, descripcion: "Cierto cuando el rango observado ha recortado la recomendación", es_clave: false}
      - {nombre: en_rango_observado, tipo: BOOLEAN, descripcion: "Cierto cuando la recomendación cae dentro de lo que ese operador ya ha cobrado", es_clave: false}
      - {nombre: plausible, tipo: BOOLEAN, descripcion: "Marca de calidad del dato derivado", es_clave: false}
      - {nombre: version_regla, tipo: VARCHAR, descripcion: "Firma de la regla con la que se calculó, para poder reproducirlo", es_clave: false}

  - tabla: fact_turismo_mensual
    nombre: Hecho de Turismo Mensual
    capa: Gold
    orden_capa: 6
    dominio: Demanda y Tráfico
    descripcion: Turistas mensuales entre Madrid y Barcelona del INE, con la parte de cada mes dentro de su trimestre; es lo que da el perfil mensual del reparto de la demanda.
    grano: Un mes y par de provincias
    claves: [anio, mes, origen, destino]
    formato: Parquet
    proceso: gold_build
    frecuencia: Mensual
    quality_gates: [filas_minimas, grano_unico, sin_nulos, mes_valido, la_cuota_suma_uno_por_trimestre]
    upstream: [silver:turismo_mensual, gold:dim_fecha]
    downstream: [dataset:turismo_mensual, dashboard:prediccion-demanda]
    columnas:
      - {nombre: anio, tipo: INT, descripcion: "Año del dato", es_clave: true}
      - {nombre: mes, tipo: INT, descripcion: "Mes del dato", es_clave: true}
