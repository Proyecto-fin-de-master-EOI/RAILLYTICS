  - tabla: cargas
    nombre: Trazabilidad de Cargas
    capa: Metadatos
    orden_capa: 9
    dominio: Gobernanza y Auditoría
    descripcion: Registro de auditoría técnica persistente en _trazabilidad/cargas/ con una fila por ejecución y tabla procesada.
    grano: Una ejecución y tabla cargada
    claves: [run_id, tabla]
    formato: Parquet
    proceso: raillytics.utils.cargas / Cargas.scala
    frecuencia: Continuo por ejecución
    quality_gates: [best_effort_audit]
    upstream: [todos_los_procesos]
    downstream: [dashboard:trazabilidad-cargas, dashboard:lineage-cargas]
    columnas:
      - {nombre: run_id, tipo: VARCHAR, descripcion: "ID único de ejecución", es_clave: true, termino_glosario: "Run ID"}
      - {nombre: proceso, tipo: VARCHAR, descripcion: "Nombre del componente técnico", es_clave: false}
      - {nombre: tabla, tipo: VARCHAR, descripcion: "Tabla escrita", es_clave: true}
      - {nombre: filas, tipo: BIGINT, descripcion: "Número de registros producidos", es_clave: false}
      - {nombre: duracion_s, tipo: DOUBLE, descripcion: "Segundos empleados", es_clave: false, termino_glosario: "Trazabilidad de Cargas"}
      - {nombre: estado, tipo: VARCHAR, descripcion: "'ok' o 'error'", es_clave: false}

  - tabla: calidad
    nombre: Historial de Quality Gates
    capa: Metadatos
    orden_capa: 9
    dominio: Gobernanza y Auditoría
    descripcion: Registro de cada comprobación de control de calidad evaluada durante las cargas del lakehouse.
    grano: Una regla de calidad evaluada en una ejecución
    claves: [run_id, tabla, gate]
    formato: Parquet
    proceso: raillytics.calidad / QualityGates.scala
    frecuencia: Continuo por ejecución
    quality_gates: [audit_gate]
    upstream: [todos_los_procesos]
    downstream: [dashboard:trazabilidad-cargas, dashboard:lineage-cargas]
    columnas:
      - {nombre: run_id, tipo: VARCHAR, descripcion: "ID único de ejecución", es_clave: true, termino_glosario: "Run ID"}
      - {nombre: tabla, tipo: VARCHAR, descripcion: "Tabla evaluada", es_clave: true}
      - {nombre: gate, tipo: VARCHAR, descripcion: "Nombre de la regla", es_clave: true, termino_glosario: "Quality Gate (Control de Calidad)"}
      - {nombre: resultado, tipo: VARCHAR, descripcion: "'ok' o 'fallo'", es_clave: false}
