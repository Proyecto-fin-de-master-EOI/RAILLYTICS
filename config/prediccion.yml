# Consultas de entrada de la predicción diaria de demanda (raillytics.prediccion.entradas).
#
# Cada origen es un SELECT de DuckDB que traduce lo que los DAGs de Airflow dejan en el lake al
# contrato de la predicción. Debe devolver EXACTAMENTE estas columnas, en este orden:
#
#   trimestrales  trimestre ('AAAA-Tn'), viajeros (entero)
#                 UNA fila por trimestre: solo el corredor AVE Madrid–Barcelona, ambos sentidos sumados.
#   festivos      fecha (DATE), nombre
#   eventos       fecha (DATE), descripcion, ciudad ('MAD', 'BCN' o NULL)
#   meteo         fecha (DATE), ciudad ('MAD' | 'BCN'), temperatura_media, precipitacion_mm
#                 UNA fila por (fecha, ciudad) con valores OBSERVADOS. La climatología (promedio histórico
#                 del mes) para los días futuros la calcula la propia predicción a partir de estas filas.
#
# Marcadores de ruta: {bronze}, {silver}, {gold} (bucket de MinIO o directorio local, según el .env).
#
# ORIGEN DE LOS DATOS:
#   trimestrales  REAL: la demanda del corredor de la CNMC, que construye `make 04_silver` en {silver}/cnmc_trimestral
#                 (suma de los operadores del corredor, sin la fila TOTAL, que solo trae ingresos).
#   eventos       REAL, pero curado a mano en config/eventos_corredor.csv: no existe fuente abierta con histórico de
#                 eventos con fecha (Madrid publica solo los próximos 100 días y Barcelona solo series anuales
#                 agregadas). Son los eventos que mueven viajeros ENTRE las dos ciudades: ferias grandes, Clásicos,
#                 festivales y F1. Al añadir un año hay que ampliar ese CSV a mano.
#   festivos      REAL: el calendario laboral del BOE, parseado a (fecha, nombre) por
#                 `make festivos`. OJO: no están las fiestas LOCALES de cada municipio (dos al
#                 año), que no las publica el BOE sino cada comunidad autónoma.
#   meteo         REAL: valores observados de AEMET en Madrid-Barajas y Barcelona-El Prat, que trae
#                 `make meteo`. AEMET publica con retardo, así que la serie acaba unos días antes de
#                 hoy; la climatología de los días futuros la calcula la propia predicción.
#   (ya no hay orígenes sintéticos: `make prediccion-sample` genera
#                 las fuentes en {bronze}/l2/muestra_<fuente>/ con las columnas que asumen estas consultas, para poder
#                 probar 07_prediccion y 00_ingest hasta que existan las reales (fase 2). La predicción avisa, con el nombre
#                 de cada origen afectado, cada vez que corre con alguno sintético.
#
# Cuando exista la fuente REAL de un origen sintético: cambia en su consulta la ruta `muestra_<fuente>` por la de la fuente
# real y ajusta las columnas a las suyas. Para ver las columnas reales de una fuente, en DuckDB:
#   DESCRIBE SELECT * FROM read_parquet('s3://raillytics-bronze/l2/<fuente>/*/*.parquet');
# No dejes las dos a la vez: se leerían juntas y los totales saldrían duplicados sin ningún error.
origenes:
  trimestrales:
    sql: |
      SELECT concat(anio, '-T', trimestre) AS trimestre, sum(viajeros) AS viajeros
      FROM read_parquet('{silver}/cnmc_trimestral/*.parquet')
      WHERE corredor = 'Madrid-Barcelona' AND operador_id <> 'TOTAL'
      GROUP BY 1
      ORDER BY 1
  festivos:
    # Tabla derivada del calendario laboral del BOE (ver raillytics.ingesta.boe_festivos). Son los
    # festivos en Madrid o en Cataluña: el nombre lleva «(Madrid)» o «(Cataluña)» cuando solo lo es
    # en un extremo del corredor. Se genera con `make festivos`; los datos no se versionan.
    sql: |
      SELECT fecha, nombre
      FROM read_parquet('{silver}/festivos/*.parquet')
  eventos:
    # Fichero curado a mano y versionado, no una fuente descargable: la ruta es relativa a la raíz
    # del repositorio, desde donde lo lanza `make`.
    sql: |
      SELECT fecha, descripcion, ciudad
      FROM read_csv('config/eventos_corredor.csv', header = true, types = {'fecha': 'DATE'})
  meteo:
    # Serie observada de AEMET para las dos cabeceras del corredor (ver
    # raillytics.ingesta.aemet_historico). Se genera con `make meteo`; los datos no se versionan.
    # Los nombres ya vienen convertidos: AEMET sirve tmed y prec como texto con coma decimal.
    sql: |
      SELECT fecha, ciudad, temperatura_media, precipitacion_mm
      FROM read_parquet('{silver}/meteo/*.parquet')
